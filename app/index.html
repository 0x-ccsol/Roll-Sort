<span class="cname">${esc(f.name)}</span><span class="fcount">${counts[i]}</span>
        ${i === insertPoint().folder ? "" : `<button class="fsort" data-act="setactive" data-folder="${i}" title="New photos go into this folder, after its last photo">▼ Sort here</button>`}
        <button class="fx" data-act="renamefolder" data-folder="${i}" title="Rename">✎</button><button class="fx" data-act="delfolder" data-folder="${i}" title="Delete folder">✕</button>
      </div>`).join("");
  return `<div class="folders"><span class="flabel">Folders</span>${chips}${addCtl}
    <span class="fhint">New photos go into <b>${esc(S.folders[insertPoint().folder].name)}</b>. Click a folder to see it, drag to reorder.</span></div>`;
}

function atEnd(row) { return row.scrollLeft >= row.scrollWidth - row.clientWidth - 4; }

function fitLabels(row) {
  const divs = [...row.querySelectorAll(".tl-div")];
  // an empty folder has no photos to sit above, so make room for its whole name
  divs.forEach(d => { if (d.classList.contains("empty") && d.firstElementChild && !d.style.marginRight) d.style.marginRight = (d.firstElementChild.scrollWidth + 2) + "px"; });
  divs.forEach((d, i) => {
    const span = d.firstElementChild;
    if (!span) return;
    const end = i + 1 < divs.length ? divs[i + 1].offsetLeft - 10 : row.scrollWidth;
    const room = Math.max(36, end - d.offsetLeft);
    span.style.maxWidth = room + "px";
    const shift = Math.min(Math.max(0, row.scrollLeft - d.offsetLeft), Math.max(0, room - span.offsetWidth));
    span.style.transform = shift ? `translateX(${shift}px)` : "";
  });
}

function applyPin(row, smooth) {
  if (row._pin === "end") row.scrollLeft = row.scrollWidth;
  else if (row._pin === "cursor") {
    const c = row.querySelector(".tl-gap.cursor");
    if (c) row.scrollLeft = c.offsetLeft - row.clientWidth / 2;
  } else if (row._pin === "folder") {
    const d = row.querySelector(`.tl-div[data-folder="${row._folder}"]`);
    if (d) row.scrollTo({left: Math.max(0, d.offsetLeft - 8), behavior: smooth ? "smooth" : "auto"});
  }
}

function renderMerge() {
  const {next, merged, total} = derive();
  const pct = total ? Math.round(merged.length / total * 100) : 0;
  const rollStarts = new Set(S.rolls.map(r => r.start));
  const rollEnds = new Set(S.rolls.map(r => r.start + r.count - 1));
  const frameLabel = id => { const r = S.rolls[rollOf(id)]; return `frame ${id - r.start + 1}/${r.count}`; };
  const qtag = id => {
    const st = rollStarts.has(id), en = rollEnds.has(id);
    if (st && en) return `<span class="qtag both">Start · End</span><span class="rs"></span><span class="re"></span>`;
    if (st) return `<span class="qtag start">▶ Start</span><span class="rs"></span>`;
    if (en) return `<span class="qtag end">End ■</span><span class="re"></span>`;
    return "";
  };
  const active = S.lanes.map((_, l) => l).filter(l => next[l].length);
  const oldGrid = document.querySelector(".gscroll");
  const gridScroll = oldGrid ? oldGrid.scrollTop : 0;
  const oldRow = document.querySelector(".tl-row");
  const prevScroll = oldRow ? oldRow.scrollLeft : undefined;
  const wasAtEnd = oldRow ? oldRow.scrollLeft >= oldRow.scrollWidth - oldRow.clientWidth - 4 : true;

  const ip = insertPoint();
  const cur = ip.pos !== merged.length ? ip : null;  // only shown in the banner when it isn't simply "at the end"
  // sorting into folders: the banner is only for a spot picked by clicking a gap
  const banner = S.kind === "folders" && !S.cursor ? null : cur;
  const gap = (pos, folder) => {
    // the green bar marks where the next photo goes
    const on = ip.pos === pos && (!S.folders.length || ip.folder === folder);
    const where = S.folders.length ? ` in “${S.folders[folder].name}”` : "";
    return `<div class="tl-gap ${on ? "cursor" : ""}" data-act="setcursor" data-pos="${pos}" data-folder="${folder}" title="${on ? "New photos go here" : `Place new photos here${where}`}"></div>`;
  };
  const item = (m, k) => `<div class="tl-item ${S.flashIds && S.flashIds.has(m.id) ? "flash" : ""}" style="--c:${LANE_COLORS[m.lane]}" draggable="true" data-act="viewmerged" data-k="${k}" title="#${k + 1} ${esc(S.names[m.id])}. Click to enlarge, drag to move.">
      <img src="${img(m.id, "t")}" alt="" loading="lazy" draggable="false"><span class="num">${k + 1}</span></div>`;
  let tl = "";
  if (S.folders.length) {
    // one block per folder, in folder-bar order, including empty folders so they can be filled in place
    S.folders.forEach((f, fi) => {
      const [a, b] = blockRange(fi);
      tl += `<div class="tl-div ${a === b ? "empty" : ""}" data-folder="${fi}" title="Folder: ${esc(f.name)}"><span>${esc(f.name)}</span></div>`;
      for (let k = a; k < b; k++) tl += gap(k, fi) + item(merged[k], k);
      tl += gap(b, fi);
    });
  } else {
    merged.forEach((m, k) => { tl += gap(k, 0) + item(m, k); });
    tl += gap(merged.length, 0);
  }
  if (!merged.length && !S.folders.length) tl = S.kind === "folders"
    ? `<div class="tl-empty">Start by adding a folder for each group (e.g. Bracelets, Necklaces) with “+ Folder” above, then click photos below to put them in.</div>`
    : `<div class="tl-empty">Nothing placed yet. Start with whichever photo was taken first, usually the first frame of one of the cameras.</div>`;

  let body;
  if (S.kind === "folders" && active.length) {
    const {slots, open} = boardSlots();
    const whereTo = new Map(S.order.map((id, k) => [id, (S.folders[S.folderOf[k]] || {}).name || ""]));
    const banished = new Set(S.banished);
    body = `<div class="gridboard">${gbarHtml()}
      <div class="gscroll"><div class="ggrid" style="--g:${gridSize()}px">${slots.map(id => open.has(id) ? `
        <button class="gtile ${S.sel.has(id) ? "sel" : ""}" data-act="gtile" data-id="${id}" draggable="true" title="${esc(S.names[id])}">
          <img src="${img(id)}" alt="" loading="lazy" draggable="false"><span class="gfn">${esc(S.names[id])}</span>
          <span class="gzoom" data-act="gzoom" data-id="${id}" role="button" aria-label="Enlarge" title="Enlarge (Space)">${ZOOM_ICON}</span>
        </button>` : `<div class="gslot" title="Sorted. Refresh the board (R) to close up the gaps."><span>${banished.has(id) ? "⊘ banished" : `→ ${esc(whereTo.get(id) || "")}`}</span></div>`).join("")}</div></div>
      <div class="hint">Click: put in the current folder · <kbd>Shift</kbd>-click the first photo, then <kbd>Shift</kbd>-click the last: select everything between · <kbd>Space</kbd>: enlarge · <kbd>R</kbd>: refresh the board · <kbd>Z</kbd> undoes</div>
    </div>`;
  } else if (!active.length) {
    body = `<div class="finale"><div class="card">
      <h3>All ${plural(total, "photo")} are ${S.kind === "folders" ? "sorted" : "in order"}</h3>
      <p>Have a quick look through the full timeline, then export the sorted copies.</p>
      <button class="primary" data-act="review">Review &amp; export →</button>
    </div></div>`;
  } else if (active.length === 1) {
    const l = active[0]; const rest = next[l];
    body = `<div class="finale"><div class="card" style="--c:${LANE_COLORS[l]}">
      <h3>Only ${esc(S.lanes[l].name)} has photos left</h3>
      <p>The other ${S.lanes.length === 2 ? "camera is" : "cameras are"} finished, so ${rest.length === 1 ? "this last photo goes" : `these ${rest.length} go`} ${cur ? (cur.pos === 0 ? "at the very start" : `in after #${cur.pos}`) : "at the end"}${S.folders.length ? ` (into “${esc(S.folders[ip.folder].name)}”)` : ""}. You can change where by clicking a gap in the strip above.</p>
      <div class="strip">${rest.slice(0, 8).map(id => `<img src="${img(id)}" alt="" data-act="finaleimg" data-id="${id}">`).join("")}${rest.length > 8 ? `<span class="muted">+${rest.length - 8}</span>` : ""}</div>
      <button class="primary" data-act="take" data-lane="${l}" data-n="${rest.length}">Place ${rest.length === 1 ? "it" : `all ${rest.length}`} <kbd>Enter</kbd></button>
    </div></div>`;
  } else {
    const lanes = S.lanes.map((lane, l) => {
      const c = LANE_COLORS[l];
      const left = next[l].length;
      if (!left) return `<section class="lane done" style="--c:${c}"><div>${esc(lane.name)}: all placed ✓</div></section>`;
      const upcoming = next[l].slice(0, 7);
      const first = upcoming[0];
      const rname = esc(S.rolls[rollOf(first)].name);
      const isStart = rollStarts.has(first), isEnd = rollEnds.has(first);
      const startBadge = (isStart || isEnd) ? `<div class="rollflags">
          ${isStart ? `<span class="rollflag start">▶ Start of new roll<small>roll ${rname}</small></span>` : ""}
          ${isEnd ? `<span class="rollflag end">Last photo of roll ■<small>roll ${rname} ends here</small></span>` : ""}
        </div>${isStart ? `<span class="edge start"></span>` : ""}${isEnd ? `<span class="edge end"></span>` : ""}` : "";
      return `<section class="lane" style="--c:${c}" data-lane="${l}">
        <div class="lane-head"><span class="dot"></span><span class="name">${esc(lane.name)}</span><span class="left">· ${left} left</span><span class="spacer"></span>${laneKeyHint(l)}</div>
        <button class="next" data-act="take" data-lane="${l}" data-n="1" data-run="1" data-id="${first}" draggable="true" title="${esc(S.names[first])}. Click to place next, or drag it to an exact spot in the strip.">
          <img src="${img(first, "p")}" alt="" draggable="false">
          ${startBadge}
          <span class="fname">${esc(shortName(S.names[first]))} · ${frameLabel(first)}</span>
          <span class="cta">${S.mode === "banish" ? "Click to banish" : "This came next"}</span>
          <span class="zoom" data-act="zoomlane" data-lane="${l}" role="button" aria-label="Enlarge" title="Enlarge">${ZOOM_ICON}</span>
        </button>
        <div class="upnext">${upcoming.slice(1).map((id, i) => `
          <button data-act="take" data-lane="${l}" data-n="${i + 2}" data-run="${i + 2}" data-id="${id}" draggable="true" title="Click: place ${i + 2} photos from ${esc(lane.name)} (up to this one). Drag: put just this one at an exact spot in the strip.">
            <img src="${img(id)}" alt="" draggable="false">${qtag(id)}<span class="plus">+${i + 2}</span>
          </button>`).join("")}</div>
      </section>`;
    }).join("");
    body = `<div class="lanes" style="grid-template-columns:repeat(${S.lanes.length},minmax(0,1fr))">${lanes}</div>
      <div class="hint">Which photo came next? Click it${S.lanes.length === 2 ? " or press <kbd>←</kbd> / <kbd>→</kbd>" : " or press its number"}. Click a small one to place a whole run at once. Drag photos in the top strip to fix their order. <kbd>Z</kbd> undoes.</div>`;
  }

  app.innerHTML = topBar(`${progressHtml()}
    <button class="small" data-act="undo" ${S.history.length ? "" : "disabled"} title="Undo (Z)">↶ Undo</button>`) + `
  <div class="merge ${S.mode ? "mode-" + S.mode : ""}">
    <div class="timeline">
      ${folderBar(merged)}
      <div class="label">${S.mode === "remove"
        ? `<span class="modebar remove" style="--c:var(--remove)"><span><b>Remove mode is on.</b> Click any photo in the strip to send it back down to the board.</span><button class="small" data-act="modeoff">Back to normal <kbd>Esc</kbd></button></span>`
        : S.mode === "banish"
        ? `<span class="modebar banish" style="--c:var(--banish)"><span><b>Banish mode is on.</b> Click any photo, in the strip or on the board, to take it out of the sort. Recover it any time from “Banished”.</span><button class="small" data-act="modeoff">Back to normal <kbd>Esc</kbd></button></span>`
        : banner
        ? `<span class="insertbar">New photos go in ${banner.pos === 0 ? "at the very start" : `after #${banner.pos}`}${S.folders.length ? `, into “${esc(S.folders[banner.folder].name)}”` : ""}<button class="small" data-act="clearcursor">Back to the end <kbd>Esc</kbd></button></span>`
        : `<span>The green bar shows where the next photo goes. Click any gap to move it there. Drag photos to reorder, or onto the board below to un-place.</span>`}
        <span class="tools">
          <label class="modebox remove ${S.mode === "remove" ? "on" : ""}" style="--c:var(--remove)" title="While ticked, clicking a photo in the strip sends it back to the board"><input type="checkbox" data-act="mode" data-mode="remove" ${S.mode === "remove" ? "checked" : ""}>Remove from timeline</label>
          <label class="modebox banish ${S.mode === "banish" ? "on" : ""}" style="--c:var(--banish)" title="While ticked, clicking a photo takes it out of the sort (it isn't exported). Nothing is deleted."><input type="checkbox" data-act="mode" data-mode="banish" ${S.mode === "banish" ? "checked" : ""}>Banish from sorting</label>
          <button class="small" data-act="showbanished" ${S.banished.length ? "" : "disabled"} title="See banished photos and recover them">⊘ Banished (${S.banished.length})</button>
          ${merged.length ? `<span>${merged.length} placed</span>` : ""}
        </span></div>
      <div class="tl-row">${tl}</div>
    </div>
    ${body}
  </div>`;
  S.flashIds = null;

  const row = document.querySelector(".tl-row");
  if (row) {
    const first = prevScroll === undefined;
    let pin = null;
    if (S.scrollToFolder !== undefined) pin = "folder";
    else if (cur && (S.scrollToCursor || first)) pin = "cursor";
    else if (!cur && (S.scrollToEnd || first || (wasAtEnd && !S.keepScroll))) pin = "end";
    row._pin = pin; row._folder = S.scrollToFolder;
    row.scrollLeft = prevScroll || 0;
    applyPin(row, pin === "folder");
    fitLabels(row);
    // big previews change width as they load: re-apply the pin so the view doesn't drift
    row.querySelectorAll("img").forEach(im => { if (!im.complete) im.addEventListener("load", () => { applyPin(row, false); fitLabels(row); }); });
    row.addEventListener("scroll", () => fitLabels(row), {passive: true});
    // as soon as the person scrolls by hand, stop pinning (until they scroll back to the end)
    const release = () => { row._pin = null; };
    row.addEventListener("wheel", release, {passive: true});
    wheelScrollsSideways(row);
    row.addEventListener("pointerdown", release);
    row.addEventListener("scroll", () => { if (!row._pin && atEnd(row) && !S.cursor) row._pin = "end"; }, {passive: true});
  }
  S.scrollToEnd = false; S.scrollToCursor = false; S.scrollToFolder = undefined; S.keepScroll = false;
  const grid = document.querySelector(".gscroll");
  if (grid) {
    grid.scrollTop = gridScroll;
    // the photo under the mouse changes when the grid reflows: keep the number keys pointing at it
    const under = lastMouse && document.elementFromPoint(lastMouse[0], lastMouse[1]);
    const t = under && under.closest && under.closest(".gtile");
    S.hoverId = t ? +t.dataset.id : null;
    armAutoRefresh();
  }
  const input = document.getElementById("newFolder") || document.getElementById("renameFolder");
  if (input) { input.focus(); input.select(); }

  // preload what's coming
  for (const l of active) for (const id of next[l].slice(1, 3)) { const im = new Image(); im.src = img(id, "p"); }
}

function renderReview() {
  if (!S.reviewBase) S.reviewBase = stateCopy();  // arriving from the Sort tab: this is what "revert" goes back to
  const changed = sigOf(S.reviewBase) !== stateSig();
  const {merged, total} = derive();
  const complete = merged.length === total;
  const example = exampleName(merged);
  const cell = (m, k) => `
    <button class="cell ${S.flashIds && S.flashIds.has(m.id) ? "flash" : ""}" style="--c:${LANE_COLORS[m.lane]}" draggable="true" data-act="viewmerged" data-k="${k}" title="#${k + 1} ${esc(S.names[m.id])}. Click to enlarge, drag to move.">
      <img src="${img(m.id)}" alt="" loading="lazy" draggable="false"><span class="num">${k + 1}</span>
    </button>`;
  const gname = f => S.renaming === f
    ? `<form class="chipform" data-act="renameform" data-folder="${f}"><input type="text" id="renameFolder" value="${esc(S.folders[f].name)}" autocomplete="off"></form>`
    : `<button class="gname" data-act="renamefolder" data-folder="${f}" title="Rename this folder">${esc(S.folders[f].name)}<span class="pen">✎</span></button>`;
  let cells;
  if (S.folders.length) {
    // one section per run of photos in the same folder
    const runs = [];
    merged.forEach((m, k) => {
      if (!runs.length || runs[runs.length - 1].folder !== m.folder) runs.push({folder: m.folder, items: []});
      runs[runs.length - 1].items.push([m, k]);
    });
    cells = runs.map(r => `<div class="ghead" data-folder="${r.folder}">${gname(r.folder)}<span class="n">${plural(r.items.length, "photo")}</span><span class="path">${esc(folderDirName(r.folder))}/</span></div>
      <div class="grid" data-folder="${r.folder}">${r.items.map(([m, k]) => cell(m, k)).join("")}</div>`).join("");
  } else {
    cells = `<div class="grid" data-folder="0">${merged.map(cell).join("")}</div>`;
  }
  app.innerHTML = topBar(`${progressHtml()}
    <button class="small" data-act="undo" ${S.history.length ? "" : "disabled"} title="Undo (Z)">↶ Undo</button>`) + `
  <main class="page">
    <div class="review-top">
      <div>
        <h2>${complete ? (S.kind === "folders" ? "Check the folders" : "Check the order") : `${merged.length} of ${total} ${S.kind === "folders" ? "sorted" : "placed"} so far`}</h2>
        <p class="intro">${S.kind === "folders"
          ? `Scroll through to check each photo is in the right folder. To fix one, drag it into the right folder. ${S.folders.length ? "Click a folder's name to rename it." : ""}`
          : `Scroll through to make sure it flows. To fix one, drag it to where it belongs, even under a different folder. ${S.folders.length ? "Click a folder's name to rename it. " : ""}For bigger fixes, click the last photo that's still right and choose “Rewind to here”.`}</p>
        <div class="revrow"><button class="small" data-act="undo" ${S.history.length ? "" : "disabled"}>↶ Undo <kbd>Z</kbd></button>
          <button class="small" data-act="revertreview" ${changed ? "" : "disabled"}>⟲ Revert all changes made on this screen</button>
          <span>${changed ? "Revert puts everything back the way it was when you came here from the Sort tab." : "No changes made on this screen yet."}</span></div>
        ${S.banished.length ? `<div class="revrow"><span>⊘ ${plural(S.banished.length, "banished photo")} won't be exported.</span><button class="small" data-act="showbanished">See them</button></div>` : ""}
        <div class="legend ${S.kind === "folders" ? "hidden" : ""}">${S.lanes.map((l, i) => `<span><span class="dot" style="--c:${LANE_COLORS[i]}"></span>${esc(l.name)}</span>`).join("")}</div>
        ${cells}
      </div>
      <aside class="export">
        <h3>Export sorted copies</h3>
        <div class="field"><label for="outdir">Save to a new folder</label>
          <div class="pathrow"><input type="text" id="outdir" data-act="outdir" value="${esc(S.outdir)}" spellcheck="false"><button class="small" data-act="pickout">Change…</button></div>
          <small>Your originals stay exactly where they are.</small></div>
        ${S.kind === "folders" ? `<div class="field"><label>File names</label>
          <label class="radio"><input type="radio" name="fnm" value="keep" data-act="fnamemode" ${S.fNameMode !== "folder" ? "checked" : ""}> Keep the original names</label>
          <label class="radio"><input type="radio" name="fnm" value="folder" data-act="fnamemode" ${S.fNameMode === "folder" ? "checked" : ""}> Folder name + number</label>
          <div class="example" id="example">${esc(example)}</div>
          <small>Each copy keeps the photo's own date and details.</small></div>`
        : `<div class="field"><label for="wdate">Wedding date</label>
          <input type="date" id="wdate" data-act="date" value="${esc(S.date)}">
          <small>Each copy gets a capture time 10 seconds after the last, so Lightroom and other apps sort them correctly. The times are made up; only the order is real.</small></div>
        <div class="field"><label>File names</label>
          <label class="radio"><input type="radio" name="nm" value="keep" data-act="namemode" ${S.nameMode !== "custom" ? "checked" : ""}> Number + lab's original name</label>
          <label class="radio"><input type="radio" name="nm" value="custom" data-act="namemode" ${S.nameMode === "custom" ? "checked" : ""}> Number + my own name</label>
          <input type="text" id="prefix" data-act="prefix" placeholder="e.g. Smith Wedding" value="${esc(S.prefix)}" class="${S.nameMode === "custom" ? "" : "hidden"}" style="margin-top:6px">
          <div class="example" id="example">${esc(example)}</div></div>`}
        ${complete ? "" : `<label class="radio check"><input type="checkbox" data-act="partial" ${S.partialExport ? "checked" : ""}>
          <span>Export without the ${plural(total - merged.length, "photo")} still ${S.kind === "folders" ? "unsorted" : "on the board"}<small>For scrap frames you don't want. They're simply left out; nothing is deleted.</small></span></label>`}
        <label class="radio check"><input type="checkbox" data-act="clearprev" ${S.clearPreviews ? "checked" : ""}>
          <span>Clear ${S.kind === "folders" ? "these photos'" : "this wedding's"} previews after exporting <span id="wedPrev" class="muted"></span>
          <small>${appName()} keeps preview pictures of every photo so they show quickly, and over time they take up space. When ticked, the previews of these photos are deleted once the export has finished. Your photos, your progress and the exported copies are not touched.
          <b>If you'll come back to work on these photos again, untick it</b>, so they show quickly next time. You can always clear previews later from the Folder screen.</small></span></label>
        <button class="primary bigbtn" data-act="export" ${complete || (S.partialExport && merged.length) ? "" : "disabled"}>${complete ? `Export ${total} copies`
          : S.partialExport ? (merged.length ? `Export ${merged.length} copies, leave out ${total - merged.length}` : "Place at least one photo first")
          : "Place every photo first"}</button>
        <div id="jobStatus"></div>
      </aside>
    </div>
  </main>`;
  renderExportStatus();
  showWeddingPreviewSize();
  S.flashIds = null;
  const input = document.getElementById("renameFolder");
  if (input) { input.focus(); input.select(); }
}

// How much space this wedding's previews use, next to the "clear after exporting" box
function showWeddingPreviewSize() {
  api("/api/cache?scope=wedding").then(c => {
    const el = document.getElementById("wedPrev");
    if (el) el.textContent = c.bytes ? `(about ${fmtBytes(c.bytes)})` : "";
  }).catch(() => {});
}

function renderExportStatus() {
  const el = document.getElementById("jobStatus");
  if (!el || !exportJob) return;
  if (exportJob.error) { el.innerHTML = `<div class="err">${esc(exportJob.error)}</div>`; return; }
  const pct = exportJob.total ? Math.round(exportJob.done / exportJob.total * 100) : 0;
  if (!exportJob.finished) {
    el.innerHTML = `<div class="jobbar"><div style="width:${pct}%"></div></div><div class="muted">Copying ${exportJob.done} of ${exportJob.total}…</div>`;
    return;
  }
  el.innerHTML = `<div class="jobbar"><div style="width:100%"></div></div>
    <p class="ok">Done: ${plural(exportJob.total, "copy").replace("copys", "copies")} saved.${exportJob.leftOut ? ` ${exportJob.leftOut} left out.` : ""}</p>
    <div class="muted mono" style="font-size:12px;word-break:break-all">${esc(exportJob.outdir)}</div>
    ${exportJob.previews_freed != null ? `<p class="muted" style="font-size:12px">Cleared ${fmtBytes(exportJob.previews_freed)} of preview pictures for this wedding.</p>` : ""}
    ${exportJob.exif_skipped ? `<p class="muted" style="font-size:12px">${exportJob.exif_skipped} non-JPEG file(s) got numbered names but no capture time. Sort by file name to be safe.</p>` : ""}
    <p><button class="small" data-act="reveal">Open folder</button></p>`;
}

// ---------------------------------------------------------------- overlays
function renderOverlay() {
  document.querySelector(".overlay")?.remove();
  if (!overlay || stopped) return;
  const el = document.createElement("div");
  el.className = "overlay";
  if (overlay.kind === "choice") {
    el.innerHTML = `<div class="choice" role="dialog" aria-modal="true">
      <h3>${esc(overlay.title)}</h3><p>${esc(overlay.text)}</p>
      ${overlay.list ? `<ul class="warnlist">${overlay.list.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}
      ${overlay.options.map((o, i) => `<button class="opt ${o.danger ? "danger" : ""}" data-act="choice" data-i="${i}"><b>${esc(o.label)}</b><span>${esc(o.sub || "")}</span></button>`).join("")}
      <button class="ghost cancel" data-act="closeov">Cancel</button></div>`;
    document.body.appendChild(el);
    return;
  }
  if (overlay.kind === "banished") {
    const list = S.banished.slice().reverse();  // most recently banished first
    el.classList.add("banished-ov");
    el.innerHTML = `<div class="ov-top"><span class="cap"><b>Banished photos</b> · ${list.length ? `${plural(list.length, "photo")}. Click one to recover it: it goes back on the board, in its camera's lane.` : "none right now"}</span>
        <button class="small" data-act="undo" ${S.history.length ? "" : "disabled"} title="Undo the last change (Z)">↶ Undo <kbd>Z</kbd></button>
        ${list.length > 1 ? `<button class="small" data-act="recoverall">Recover all</button>` : ""}
        <button data-act="closeov">Close <kbd>Esc</kbd></button></div>
      ${list.length ? `<div class="ov-grid">${list.map(id => `<button data-act="recover" data-id="${id}" title="${esc(S.names[id])}. Click to recover it."><img src="${img(id)}" alt="" loading="lazy"><span class="num">${esc(shortName(S.names[id]))}</span></button>`).join("")}</div>`
        : `<div class="ov-empty">Nothing is banished. On the Sort tab, tick “Banish from sorting” and click a photo to banish it.</div>`}`;
    document.body.appendChild(el);
    return;
  }
  if (overlay.kind === "roll") {
    const roll = S.rolls[overlay.roll];
    el.innerHTML = `<div class="ov-top"><span class="cap"><b>${esc(roll.name)}</b> · ${plural(roll.count, "photo")} in frame order</span><button data-act="closeov">Close <kbd>Esc</kbd></button></div>
      <div class="ov-grid">${range(roll.start, roll.count).map((id, i) => `<button data-act="rollphoto" data-i="${i}" title="${esc(S.names[id])}"><img src="${img(id)}" alt="" loading="lazy"><span class="num">${i + 1}</span></button>`).join("")}</div>`;
  } else {
    const id = overlay.list[overlay.i];
    const r = rollOf(id); const l = laneOfRoll(r);
    el.innerHTML = `<div class="ov-top">
        <span class="cap">${overlay.title ? esc(overlay.title(overlay.i)) + " · " : ""}${esc(S.lanes[l]?.name || "")} · roll ${esc(S.rolls[r].name)} · <span class="mono">${esc(S.names[id])}</span></span>
        ${overlay.rewind ? `<button class="small" data-act="rewind">Rewind to here</button>` : ""}
        <button data-act="closeov">Close <kbd>Esc</kbd></button></div>
      <div class="ov-body">
        <button class="ov-nav" data-act="ovprev" ${overlay.i > 0 ? "" : "disabled"} aria-label="Previous">‹</button>
        <div class="ov-img"><img src="${img(id, "p")}" alt=""></div>
        <button class="ov-nav" data-act="ovnext" ${overlay.i < overlay.list.length - 1 ? "" : "disabled"} aria-label="Next">›</button>
      </div>`;
  }
  document.body.appendChild(el);
}

function openPhotos(list, i, opts) { overlay = Object.assign({kind: "photo", list, i}, opts || {}); renderOverlay(); }

// ---------------------------------------------------------------- render + events
async function render() {
  if (stopped) return;
  if (!APP) view = "choose";
  if (view === "choose") renderChooser();
  else if (view === "home" || !S) {
    let recent = [], cache = null;
    try { [recent, cache] = await Promise.all([api(`/api/recent?app=${APP}`), api("/api/cache")]); } catch (e) {}
    if (view === "choose") return;  // switched while loading
    renderHome(recent, cache);
  }
  else if (view === "setup") renderSetup();
  else if (view === "merge") renderMerge();
  else if (view === "review") renderReview();
  renderOverlay();
}

app.addEventListener("click", e => handle(e));
document.body.addEventListener("click", e => {
  if (!e.target.closest(".overlay")) return;
  if (overlay && overlay.kind === "photo" && !e.target.closest("[data-act], button") && !onShownImage(e)) return closeOverlay();
  handle(e);
});
// The large photo fills its box with "contain", so the empty bands beside it are still the <img>.
function onShownImage(e) {
  const im = e.target.closest(".ov-img img");
  if (!im || !im.naturalWidth) return false;
  const b = im.getBoundingClientRect();
  const k = Math.min(b.width / im.naturalWidth, b.height / im.naturalHeight);
  const w = im.naturalWidth * k, h = im.naturalHeight * k;
  const x = b.left + (b.width - w) / 2, y = b.top + (b.height - h) / 2;
  return e.clientX >= x && e.clientX <= x + w && e.clientY >= y && e.clientY <= y + h;
}
app.addEventListener("submit", e => {
  e.preventDefault();
  const act = e.target.dataset.act;

  if (act === "addfolderform") {

});
app.addEventListener("focusout", e => {

});
app.addEventListener("keydown", e => {

app.addEventListener("input", e => {

});
app.addEventListener("change", e => {

let lastMouse = null;

// ---------------------------------------------------------------- drag and drop
// Setup screen: drag rolls between cameras. Merge screen: drag placed photos to reorder,
// or onto a folder chip to move them into that folder.
let drag = null;  // {kind: "roll", roll} | {kind: "photo", k}

function clearDropUI() {
  document.querySelectorAll(".drop-marker, .tl-marker, .chip-marker, .rv-marker").forEach(x => x.remove());
  document.querySelectorAll(".tl-gap.dropping").forEach(x => x.classList.remove("dropping"));
  document.querySelectorAll(".drop-target").forEach(x => x.classList.remove("drop-target"));
}

function rollDropSpot(e) {
  const add = e.target.closest(".addcam");
  if (add) return {add};
  const cam = e.target.closest(".cam");
  if (!cam) return null;
  const list = cam.querySelector(".rolls");
  const cards = [...list.querySelectorAll(".roll")].filter(c => +c.dataset.roll !== drag.roll);
  let index = cards.length;
  for (let i = 0; i < cards.length; i++) {
    const box = cards[i].getBoundingClientRect();
    if (e.clientY < box.top + box.height / 2) { index = i; break; }
  }
  return {cam, list, lane: +cam.dataset.lane, index, before: cards[index] || null};
}

function photoDropSpot(e) {
  const chip = e.target.closest("[data-dropfolder]");
  if (chip) return {chip, folder: +chip.dataset.dropfolder};
  const board = e.target.closest(".lanes, .finale, .gridboard");
  if (board) return {board};
  const row = e.target.closest(".tl-row");
  if (!row) return null;
  // walk photos and folder dividers left to right; the divider passed last says which folder it lands in
  const parts = [...row.querySelectorAll(".tl-item, .tl-div")].filter(x => !(drag.kind === "photo" && x.classList.contains("tl-item") && +x.dataset.k === drag.k));
  let index = 0, folder, before = null;
  for (const el of parts) {
    const box = el.getBoundingClientRect();
    if (e.clientX < box.left + box.width / 2) { before = el; break; }
    if (el.classList.contains("tl-div")) folder = +el.dataset.folder;
    else index++;
  }
  if (S.folders.length && folder === undefined) folder = 0;  // before the first folder's label
  return {row, index, folder: S.folders.length ? folder : undefined, before};
}

// Review grid: photos sit in rows that wrap, so find the photo the pointer is in front of.
// Drop on a folder heading = start of that folder. Positions count photos with the dragged one taken out.
function reviewDropSpot(e) {
  const head = e.target.closest(".ghead");
  const grid = head ? head.nextElementSibling : e.target.closest(".grid");
  if (!grid || !grid.classList.contains("grid")) return null;
  const folder = +grid.dataset.folder;
  let start = 0;
  S.folderOf.forEach((f, k) => { if (k !== drag.k && f < folder) start++; });
  const cells = [...grid.querySelectorAll(".cell")].filter(c => +c.dataset.k !== drag.k);
  let i = cells.length;
  if (head) i = 0;
  else for (let j = 0; j < cells.length; j++) {
    const b = cells[j].getBoundingClientRect();
    if (e.clientY < b.top || (e.clientY <= b.bottom && e.clientX < b.left + b.width / 2)) { i = j; break; }
  }
  return {grid, head, folder: S.folders.length ? folder : undefined, index: start + i, before: cells[i] || null, after: cells[i] ? null : cells[cells.length - 1] || null};
}

function showReviewMarker(spot) {
  let m = document.querySelector(".rv-marker");
  if (!m) { m = document.createElement("div"); m.className = "rv-marker"; document.body.appendChild(m); }
  const ref = spot.before || spot.after;
  if (!ref) { const g = spot.grid.getBoundingClientRect(); m.style.cssText = `left:${g.left}px;top:${g.top}px;height:60px`; return; }
  const b = ref.getBoundingClientRect();
  m.style.cssText = `left:${(spot.before ? b.left - 7 : b.right + 3)}px;top:${b.top}px;height:${b.height}px`;
}

function folderDropSpot(e) {
  const bar = e.target.closest(".folders");
  if (!bar) return null;
  const chips = [...bar.querySelectorAll(".chip[data-dropfolder]")].filter(c => +c.dataset.folder !== drag.i);
  let index = chips.length;
  for (let i = 0; i < chips.length; i++) {
    const box = chips[i].getBoundingClientRect();
    if (e.clientY < box.top || (e.clientY <= box.bottom && e.clientX < box.left + box.width / 2)) { index = i; break; }
  }
  return {bar, index, before: chips[index] || bar.querySelector("[data-act=addfolder], .chipform")};
}

// A small preview under the cursor instead of the browser's full-size ghost of the board photo.
function smallDragImage(e, el) {
  const pic = el.querySelector("img");
  if (!pic || !pic.complete || !pic.naturalWidth) return;
  const box = el.getBoundingClientRect();
  const w = Math.round(Math.min(200, Math.max(70, box.width / 4)));
  const h = Math.round(w * pic.naturalHeight / pic.naturalWidth);
  const canvas = document.createElement("canvas");
  canvas.width = w * 2; canvas.height = h * 2;  // sharp on retina screens
  canvas.style.cssText = `position:fixed;left:-9999px;top:0;width:${w}px;height:${h}px;border-radius:4px`;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(pic, 0, 0, canvas.width, canvas.height);
  document.body.appendChild(canvas);
  e.dataTransfer.setDragImage(canvas, w / 2, h / 2);
  setTimeout(() => canvas.remove(), 0);
}

// Dragging a roll: a compact card (its name + first few frames) instead of the browser's picture of
// the whole card, which in Chrome also paints the strip's scrolled-away frames off to the right.
function rollDragImage(e, card) {
  const roll = S.rolls[+card.dataset.roll];
  const pics = [...card.querySelectorAll(".strip img")].filter(p => p.complete && p.naturalWidth).slice(0, 3);
  const ph = 46, gap = 3, pad = 6, labelH = 20;
  const widths = pics.map(p => Math.round(ph * p.naturalWidth / p.naturalHeight));
  const w = Math.max(150, Math.min(260, widths.reduce((a, b) => a + b + gap, -gap) + pad * 2));
  const h = pad + labelH + (pics.length ? ph + pad : 0);
  const k = 2;  // sharp on retina screens
  const canvas = document.createElement("canvas");
  canvas.width = w * k; canvas.height = h * k;
  canvas.style.cssText = `position:fixed;left:-9999px;top:0;width:${w}px;height:${h}px`;
  const ctx = canvas.getContext("2d");
  ctx.scale(k, k);
  const css = getComputedStyle(card);
  ctx.fillStyle = "#262626";
  ctx.beginPath(); (ctx.roundRect ? ctx.roundRect(0, 0, w, h, 8) : ctx.rect(0, 0, w, h)); ctx.fill();
  ctx.fillStyle = getComputedStyle(card.closest(".cam")).getPropertyValue("--c").trim() || "#e9a23b";  // camera colour edge
  ctx.fillRect(0, 0, 4, h);
  ctx.fillStyle = "#eee"; ctx.font = `600 13px ${css.fontFamily}`; ctx.textBaseline = "middle";
  ctx.fillText(`${roll.name} · ${plural(roll.count, "photo")}`, pad + 4, pad + labelH / 2, w - pad * 2 - 4);
  let x = pad + 4;
  pics.forEach((p, i) => {
    if (x >= w - pad) return;
    const pw = Math.min(widths[i], w - pad - x);
    ctx.drawImage(p, 0, 0, p.naturalWidth * pw / widths[i], p.naturalHeight, x, pad + labelH, pw, ph);
    x += pw + gap;
  });
  document.body.appendChild(canvas);
  e.dataTransfer.setDragImage(canvas, 24, h / 2);
  setTimeout(() => canvas.remove(), 0);
}

function endDrag() {
  drag = null; clearDropUI();
  document.querySelectorAll(".dragging").forEach(x => x.classList.remove("dragging"));
}

let downOnStripBar = false;
let downAt = null;  // where the button went down, to tell a wobbly click from a real drag
app.addEventListener("pointerdown", e => {
  downAt = {x: e.clientX, y: e.clientY};
  const strip = e.target.closest && e.target.closest(".roll .strip");
  downOnStripBar = !!strip && e.target === strip && e.offsetY >= strip.clientHeight;  // below the photos = the bar
}, true);
app.addEventListener("dragstart", e => {
  if (downOnStripBar) { e.preventDefault(); return; }
  if (view === "merge" && S && S.mode) { e.preventDefault(); return; }  // clicking only, while a mode is on
  const t = e.target.closest ? e.target : e.target.parentElement;
  const card = view === "setup" && t.closest(".roll[draggable]");
  const photo = view === "merge" && t.closest(".tl-item[draggable]");
  const fresh = view === "merge" && t.closest(".lane [data-id][draggable], .gtile[data-id]");
  const chip = view === "merge" && t.closest(".chip[data-dropfolder][draggable]");
  const cell = view === "review" && t.closest(".cell[draggable]");
  if (cell) drag = {kind: "review", k: +cell.dataset.k};
  else if (chip) drag = {kind: "folder", i: +chip.dataset.folder};
  else if (card) drag = {kind: "roll", roll: +card.dataset.roll};
  else if (photo) drag = {kind: "photo", k: +photo.dataset.k};
  else if (fresh) drag = {kind: "board", id: +fresh.dataset.id, grid: fresh.classList.contains("gtile"), from: downAt};
  else return;
  const el = cell || chip || card || photo || fresh;
  if (fresh || cell) smallDragImage(e, el);
  if (card) rollDragImage(e, card);
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", "roll-merge");  // needed for Firefox
  requestAnimationFrame(() => el.classList.add("dragging"));
});

app.addEventListener("dragover", e => {
  if (!drag) return;
  if (drag.kind === "roll") {
    const spot = rollDropSpot(e);
    if (!spot) { clearDropUI(); return; }
    e.preventDefault(); e.dataTransfer.dropEffect = "move";
    if (spot.add) {
      clearDropUI();
      if (S.lanes.length < MAX_CAMERAS) spot.add.classList.add("drop-target");
      return;
    }
    document.querySelectorAll(".drop-target").forEach(x => { if (x !== spot.cam) x.classList.remove("drop-target"); });
    spot.cam.classList.add("drop-target");
    let marker = document.querySelector(".drop-marker");
    if (!marker) { marker = document.createElement("div"); marker.className = "drop-marker"; }
    if (marker.parentNode !== spot.list || marker.nextElementSibling !== spot.before) {
      if (spot.before) spot.list.insertBefore(marker, spot.before); else spot.list.appendChild(marker);
    }
    return;
  }
  if (drag.kind === "review") {
    // long weddings don't fit on one screen: scroll when the photo is held near the top or bottom edge
    const edge = 90;
    if (e.clientY < edge) window.scrollBy(0, -Math.ceil((edge - e.clientY) / 4));
    else if (e.clientY > innerHeight - edge) window.scrollBy(0, Math.ceil((e.clientY - innerHeight + edge) / 4));
    const spot = reviewDropSpot(e);
    if (!spot) { clearDropUI(); return; }
    e.preventDefault(); e.dataTransfer.dropEffect = "move";
    document.querySelectorAll(".drop-target").forEach(x => { if (x !== spot.head) x.classList.remove("drop-target"); });
    if (spot.head) spot.head.classList.add("drop-target");
    showReviewMarker(spot);
    return;
  }
  if (drag.kind === "folder") {
    const spot = folderDropSpot(e);
    if (!spot) { clearDropUI(); return; }
    e.preventDefault(); e.dataTransfer.dropEffect = "move";
    let marker = document.querySelector(".chip-marker");
    if (!marker) { marker = document.createElement("span"); marker.className = "chip-marker"; }
    if (marker.nextElementSibling !== spot.before) spot.bar.insertBefore(marker, spot.before);
    return;
  }
  const spot = photoDropSpot(e);
  if (!spot || (drag.kind === "board" && !spot.row)) { clearDropUI(); return; }  // board photos only drop into the strip
  e.preventDefault(); e.dataTransfer.dropEffect = "move";
  if (spot.chip || spot.board) {
    clearDropUI(); (spot.chip || spot.board).classList.add("drop-target");
    return;
  }
  document.querySelectorAll(".drop-target").forEach(x => x.classList.remove("drop-target"));
  // light up the gap the photo will land in (each photo's gap sits just before it; the end gap is last)
  const g = spot.before ? spot.before.previousElementSibling : spot.row.lastElementChild;
  document.querySelectorAll(".tl-gap.dropping").forEach(x => { if (x !== g) x.classList.remove("dropping"); });
  if (g && g.classList.contains("tl-gap")) g.classList.add("dropping");
});

app.addEventListener("drop", e => {
  if (!drag) return;
  e.preventDefault();
  const d = drag;
  const spot = d.kind === "roll" ? rollDropSpot(e) : d.kind === "folder" ? folderDropSpot(e) : d.kind === "review" ? reviewDropSpot(e) : photoDropSpot(e);
  endDrag();
  if (!spot) return;
  if (d.kind === "review") return movePhoto(d.k, spot.index, spot.folder);
  if (d.kind === "folder") return moveFolder(d.i, spot.index);
  if (d.kind === "board") return spot.row ? placeAt(d.id, spot.index, spot.folder) : undefined;
  if (d.kind === "photo") {
    if (spot.chip) return assignFolder(d.k, spot.folder);
    if (spot.board) return sendToBoard(d.k);
    return movePhoto(d.k, spot.index, spot.folder);
  }
  const r = d.roll;
  if (spot.add) {
    if (S.lanes.length >= MAX_CAMERAS) return;
    return changeSetup(() => {
      S.lanes.forEach(l => { l.rolls = l.rolls.filter(x => x !== r); });
      S.lanes.push({name: `Camera ${S.lanes.length + 1}`, rolls: [r]});
    });
  }
  const lanes = S.lanes.map(l => l.rolls.filter(x => x !== r));
  lanes[spot.lane].splice(spot.index, 0, r);
  if (JSON.stringify(lanes) === setupSig()) return;  // dropped where it already was
  changeSetup(() => { S.lanes.forEach((l, i) => { l.rolls = lanes[i]; }); });
});

app.addEventListener("dragend", e => {
  // Roll Sort board: a press that only wobbled a little and landed nowhere was meant as a click
  const d = drag;
  endDrag();
  if (d && d.grid && d.from && e.dataTransfer.dropEffect === "none" && (e.clientX || e.clientY)
      && Math.hypot(e.clientX - d.from.x, e.clientY - d.from.y) < 24 && S && view === "merge") gridClick(d.id, e);
});

function exampleName(merged) {
  if (S.kind === "folders") {
    const first = merged.length ? merged[0] : null;
    const dir = S.folders.length && first ? folderDirName(first.folder) : "";
    const orig = first ? S.names[first.id].split(/[\\/]/).pop() : "IMG_0001.jpg";
    const ext = (orig.match(/\.[^.]+$/) || [".jpg"])[0];
    return (dir ? dir + "/" : "") + (S.fNameMode === "folder" && dir ? `${dir} 001${ext}` : orig);
  }
  const name = S.nameMode === "custom" && S.prefix.trim()
    ? `${S.prefix.trim()} 0001.jpg`
    : `0001_${merged.length ? S.names[merged[0].id] : "000180620026.jpg"}`;
  return (S.folders.length && merged.length ? folderDirName(merged[0].folder) + "/" : "") + name;
}

function updateExample() {
  const ex = document.getElementById("example");
  if (ex) ex.textContent = exampleName(derive().merged);
}

async function handle(e) {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "FORM" || el.tagName === "INPUT") return;
  const act = el.dataset.act;
  const d = el.dataset;
  switch (act) {
    case "quit": return quitApp();
    case "choose": return chooseFolder();
    case "recent": return openFolder(d.path);
    case "tab": return goTo(d.view);
    case "review": return goTo("review");
    case "start": return goTo("merge");
    case "setcursor": return setCursor(+d.pos, +d.folder);
    case "clearcursor": S.cursor = null; S.active = Math.max(0, S.folders.length - 1); S.scrollToEnd = true; save(); return render();
    case "choice": { const o = overlay; overlay = null; renderOverlay(); return o.onPick(o.options[+d.i].value); }
    case "addcam": return changeSetup(() => S.lanes.push({name: `Camera ${S.lanes.length + 1}`, rolls: []}));
    case "removecam": return changeSetup(() => S.lanes.splice(+d.lane, 1));
    case "up": case "down": {
      const lane = S.lanes[+d.lane].rolls, i = +d.i, j = act === "up" ? i - 1 : i + 1;
      return changeSetup(() => { [lane[i], lane[j]] = [lane[j], lane[i]]; });
    }
    case "move": {
      const r = +d.roll, to = +d.to;
      return changeSetup(() => {
        S.lanes.forEach(l => { l.rolls = l.rolls.filter(x => x !== r); });
        S.lanes[to].rolls.push(r);
        S.lanes[to].rolls.sort((a, b) => a - b);
      });
    }
    case "viewroll": overlay = {kind: "roll", roll: +d.roll}; return renderOverlay();
    case "rollframe": {
      const roll = S.rolls[+d.roll];
      return openPhotos(range(roll.start, roll.count), +d.i, {title: i => `Frame ${i + 1} of ${roll.count}`});
    }
    case "rollphoto": {
      const roll = S.rolls[overlay.roll];
      return openPhotos(range(roll.start, roll.count), +d.i, {title: i => `Frame ${i + 1} of ${roll.count}`, back: overlay});
    }
    case "zoomlane": {
      const {next} = derive();
      return openPhotos(next[+d.lane], 0, {title: i => i === 0 ? "Next up" : `${i + 1} ahead`});
    }
    case "preset": return addFolders(["Pre-Ceremony", "The-Ceremony", "Reception"]);
    case "addfolder": S.addingFolder = true; return render();
    case "setactive": {
      // carry on from the end of this folder's block, wherever it sits on the timeline
      const f = +d.folder;
      S.active = f; S.cursor = null;
      if (insertPoint().pos === S.order.length) S.scrollToEnd = true; else S.scrollToCursor = true;  // show the green bar
      save(); return render();
    }
    case "jumpfolder": {
      // just look: scroll the strip to where this folder starts, change nothing
      const row = document.querySelector(".tl-row");
      if (!row) return;
      row._pin = "folder"; row._folder = +d.folder;
      applyPin(row, true);
      const div = row.querySelector(`.tl-div[data-folder="${d.folder}"]`);
      if (div) { div.classList.remove("pulse"); void div.offsetWidth; div.classList.add("pulse"); }
      return;
    }
    case "renamefolder": S.renaming = +d.folder; S.addingFolder = false; return render();
    case "delfolder": return deleteFolder(+d.folder);
    case "take":
      if (S.mode === "banish" && d.id !== undefined) return banishBoard(+d.id);
      if (S.mode) return toast(modeBlocked(), 3500);
      return take(+d.lane, +d.n);
    case "finaleimg": if (S.mode === "banish") return banishBoard(+d.id); return;
    case "undo": return undo();
    case "modeoff": return setMode(null);
    case "showbanished": overlay = {kind: "banished"}; return renderOverlay();
    case "recover": return recover(+d.id);
    case "recoverall": return recoverAll();
    case "revertreview": return revertReview();
    case "switchapp": return showChooser();
    case "pickapp": return pickApp(d.app);
    case "gtile": return gridClick(+d.id, e);
    case "gzoom": return enlargeFromGrid(+d.id);
    case "gsend": return placeIds([...S.sel]);
    case "gclear": return clearSelection();
    case "gselall": boardSlots().visible.forEach(id => S.sel.add(id)); return refreshGridSelection();
    case "grefresh": return refreshBoard();
    case "clearcache": return clearCache();
    case "resetall": return resetEverything();
    case "viewmerged": {
      if (view === "merge" && S.mode === "remove") return sendToBoard(+d.k);
      if (view === "merge" && S.mode === "banish") return banishPlaced(+d.k);
      const {merged} = derive();
      return openPhotos(merged.map(m => m.id), +d.k, {title: i => `#${i + 1} of ${merged.length}`, rewind: view === "review"});
    }
    case "rewind": {
      const k = overlay.i;
      const after = S.order.length - k - 1;
      if (after > 0 && !confirm(`Keep photos 1–${k + 1} and un-place the ${plural(after, "photo")} after it?`)) return;
      rewindTo(k); overlay = null; return goTo("merge");
    }
    case "closeov": return closeOverlay();
    case "ovprev": if (overlay.i > 0) { overlay.i--; renderOverlay(); } return;
    case "ovnext": if (overlay.i < overlay.list.length - 1) { overlay.i++; renderOverlay(); } return;
    case "pickout": {
      try {
        const r = await api("/api/pick-folder", {prompt: "Where should the sorted copies go?"});
        if (r.unavailable) { toast("Type the location into the box instead."); return; }
        if (r.path) { S.outdir = r.path.replace(/[\\/]+$/, "") + (r.path.includes("\\") ? "\\" : "/") + S.rootName + " (sorted)"; save(); renderReview(); }
      } catch (err) { toast(err.message); }
      return;
    }
    case "export": return doExport();
    case "reveal": return api("/api/reveal", {path: exportJob.outdir}).catch(err => toast(err.message));
  }
}

document.addEventListener("keydown", e => {
  if (stopped || (e.target.matches && e.target.matches("input, textarea"))) return;
  if (overlay) {
    if (e.key === "Escape") closeOverlay();
    else if (overlay.kind === "choice") return;
    else if (overlay.kind === "banished" && (e.key === "z" || e.key === "Z") && !e.metaKey && !e.ctrlKey && !e.altKey) undo();
    else if (e.key === "ArrowLeft" && overlay.kind === "photo" && overlay.i > 0) { overlay.i--; renderOverlay(); }
    else if (e.key === "ArrowRight" && overlay.kind === "photo" && overlay.i < overlay.list.length - 1) { overlay.i++; renderOverlay(); }
    else return;
    e.preventDefault(); return;
  }
  if (view === "review" && S && !e.metaKey && !e.ctrlKey && !e.altKey && (e.key === "z" || e.key === "Z")) { e.preventDefault(); undo(); return; }
  if (view === "merge" && S && S.kind === "folders" && !S.mode && (e.ctrlKey || e.metaKey) && (e.key === "a" || e.key === "A")) {
    e.preventDefault(); boardSlots().visible.forEach(id => S.sel.add(id)); refreshGridSelection(); return;
  }
  if (view !== "merge" || !S || e.metaKey && e.key !== "z" || e.ctrlKey && e.key !== "z" || e.altKey) return;
  if (S.mode) {
    if (e.key === "Escape") { e.preventDefault(); setMode(null); return; }
    if (e.key === "z" || e.key === "Z" || e.key === "Backspace") { e.preventDefault(); undo(); return; }
    if (/^[1-4]$/.test(e.key) || e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); toast(modeBlocked(), 3500); }
    return;
  }
  if (S.kind === "folders") {
    if (autoTimer) armAutoRefresh();
    if ((e.key === "r" || e.key === "R") && boardSlots().gaps) { e.preventDefault(); refreshBoard(); return; }
    if (e.key === "Enter" && S.sel.size) { e.preventDefault(); placeIds([...S.sel]); return; }
    if (e.key === " " && S.hoverId !== null) { e.preventDefault(); enlargeFromGrid(S.hoverId); return; }
    if (e.key === "Escape" && S.sel.size) { clearSelection(); return; }
    if (e.key === "z" || e.key === "Z" || e.key === "Backspace") { e.preventDefault(); undo(); return; }
    if (e.key === "Escape" && S.cursor) { S.cursor = null; save(); render(); }
    return;
  }
  const {next} = derive();
  const active = S.lanes.map((_, l) => l).filter(l => next[l].length);
  let lane = -1;
  if (/^[1-4]$/.test(e.key)) lane = +e.key - 1;
  else if (e.key === "ArrowLeft" && S.lanes.length === 2) lane = 0;
  else if (e.key === "ArrowRight" && S.lanes.length === 2) lane = 1;
  if (lane >= 0) {
    e.preventDefault();
    if (active.length >= 2 && active.includes(lane)) take(lane, 1);
    return;
  }
  if (e.key === "z" || e.key === "Z" || e.key === "Backspace") { e.preventDefault(); undo(); return; }
  if (e.key === "Escape" && insertPoint().pos !== S.order.length) { S.cursor = null; S.active = Math.max(0, S.folders.length - 1); S.scrollToEnd = true; save(); render(); return; }
  if (e.key === "Enter" && active.length === 1) {
    e.preventDefault(); const l = active[0]; take(l, next[l].length);
  }
});

// start
if (!TOKEN) app.innerHTML = `<div class="stopped"><p>Open Roll Sort with its Start file, not this page directly.</p></div>`;
else {
  if (APP) document.title = appName();
  if (params.get("open") && APP) openFolder(params.get("open"));
  else { pendingOpen = params.get("open") || null; render(); }
}
</script>
</body>
</html>
