<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roll Sort</title>
<style>
:root {
  --bg: #121212;
  --panel: #1b1b1b;
  --panel-2: #242424;
  --line: #333;
  --text: #ece7df;
  --muted: #9b958b;
  --accent: #e9a23b;
  --insert: #3ddc84;
  --drop: #4b8bff;
  --accent-ink: #1a1203;
  --danger: #e0685a;
  --radius: 10px;
  --lane-0: #e9a23b;
  --lane-1: #4fb6c2;
  --lane-2: #b48df0;
  --lane-3: #7cc46b;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 14px; cursor: pointer; white-space: nowrap;
}
button:hover:not(:disabled) { border-color: #555; background: #2c2c2c; }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover:not(:disabled) { background: #f3b257; border-color: #f3b257; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover:not(:disabled) { color: var(--text); background: var(--panel-2); border-color: var(--line); }
button.small { padding: 4px 10px; font-size: 13px; }
input[type=text], input[type=date] {
  background: #0d0d0d; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%;
  color-scheme: dark;
}
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd {
  font: 12px var(--mono); background: #2a2a2a; border: 1px solid #444; border-bottom-width: 2px;
  border-radius: 5px; padding: 1px 6px; color: var(--text);
}
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
.hidden { display: none !important; }

/* top bar */
.bar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
  padding: 10px 18px; background: rgba(18,18,18,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: .01em; font-size: 15px;
  border: 1px solid transparent; background: transparent; color: var(--text); padding: 5px 10px 5px 7px; margin-left: -8px; border-radius: 9px; cursor: pointer; }
.brand:hover { background: var(--panel-2); border-color: var(--line); }
.brand svg { width: 22px; height: 22px; }
.brand .sw { color: var(--muted); font-size: 12px; font-weight: 500; }
.brand:hover .sw { color: var(--text); }
.chooser { max-width: 860px; margin: 0 auto; padding: 11vh 24px 60px; text-align: center; }
.chooser h1 { font-size: 30px; margin: 0 0 8px; font-weight: 650; letter-spacing: -.01em; }
.chooser .lead { color: var(--muted); margin: 0 0 34px; font-size: 16px; }
.apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; text-align: left; }
.appcard { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; white-space: normal; padding: 24px 24px 22px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; cursor: pointer; position: relative; text-align: left; }
.appcard:hover { border-color: var(--accent); background: var(--panel-2); }
.appcard svg { width: 46px; height: 46px; margin-bottom: 8px; }
.appcard b { font-size: 21px; font-weight: 700; }
.appcard .what { color: var(--text); font-size: 15px; }
.appcard .eg { color: var(--muted); font-size: 13px; }
.appcard .go { margin-top: 12px; color: var(--accent); font-weight: 650; font-size: 14px; }
.appcard .inuse { position: absolute; top: 14px; right: 14px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--accent-ink); background: var(--accent); padding: 2px 8px; border-radius: 10px; font-weight: 700; }
.chooser .note { color: var(--muted); font-size: 13px; margin-top: 26px; }
.bar .crumb { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-size: 13px; }
.tabs { display: flex; gap: 2px; background: #0c0c0c; border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-left: 8px; }
.tab { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 7px; font-size: 14px; }
.tab:hover:not(:disabled) { background: var(--panel-2); color: var(--text); border: 0; }
.tab.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px #444; }
.tab .tn { font: 11px var(--mono); width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: #2a2a2a; color: var(--muted); }
.tab.on .tn { background: var(--accent); color: var(--accent-ink); }
.current { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; margin: 0 0 28px; }
.current .what { flex: 1; min-width: 0; }
.current .what small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .spacer { flex: 1; }

/* home */
.home { max-width: 640px; margin: 0 auto; padding: 12vh 24px 60px; }
.home h1 { font-size: 30px; line-height: 1.2; margin: 18px 0 10px; font-weight: 650; letter-spacing: -.01em; }
.home p.lead { color: var(--muted); margin: 0 0 28px; font-size: 16px; }
.home .pick { font-size: 16px; padding: 12px 22px; }
.home .or { color: var(--muted); font-size: 13px; margin: 26px 0 8px; }
.pathrow { display: flex; gap: 8px; }
.tip { font-size: 13px; color: var(--muted); margin-top: 8px; }
.err { color: var(--danger); margin-top: 12px; }
.recent { margin-top: 44px; }
.cachebox { margin-top: 36px; display: flex; align-items: center; gap: 16px; justify-content: space-between; padding: 14px 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.cachebox b { font-size: 14px; }
.cachebox .size { font: 13px var(--mono); color: var(--accent); margin-left: 8px; }
.cachebox small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.cachebox button { flex: none; }
.recent h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
.recent button {
  display: flex; width: 100%; justify-content: space-between; text-align: left; margin-bottom: 6px; padding: 10px 14px;
}
.recent .path { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }

/* setup */
.page { max-width: 1240px; margin: 0 auto; padding: 26px 22px 120px; }
.page h2 { font-size: 24px; margin: 0 0 6px; font-weight: 650; }
.page .intro { color: var(--muted); margin: 0 0 22px; max-width: 760px; }
.cams { display: grid; gap: 16px; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); align-items: start; }
.cam { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; border-top: 4px solid var(--c); }
.cam-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.cam-head input { font-weight: 600; background: transparent; border-color: transparent; padding: 4px 6px; }
.cam-head input:hover, .cam-head input:focus { border-color: var(--line); background: #0d0d0d; }
.cam-head .count { color: var(--muted); font-size: 13px; white-space: nowrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
.roll { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; margin-bottom: 10px; cursor: grab; transition: opacity .15s; }
.roll:active { cursor: grabbing; }
.roll.dragging { opacity: .35; }
.roll .grip { color: var(--muted); font-size: 14px; letter-spacing: -2px; margin-left: auto; cursor: grab; user-select: none; }
.drop-marker { height: 4px; border-radius: 2px; background: var(--c); box-shadow: 0 0 12px var(--c); margin: -2px 0 8px; }
.rolls { min-height: 40px; }
.rolls:has(.drop-marker) .empty-cam { display: none; }
.cam.drop-target { border-color: var(--c); }
.roll .strip { overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; border-radius: 6px; overscroll-behavior-x: contain; scrollbar-color: #555 #1b1b1b; }
.roll .strip-in { display: flex; gap: 4px; width: max-content; }
.roll .strip .fr { position: relative; flex: none; height: 92px; min-width: 60px; border-radius: 4px; overflow: hidden; background: #000; cursor: zoom-in; }
.roll .strip .fr img { height: 100%; width: auto; display: block; }
.roll .strip .fr b { position: absolute; left: 3px; top: 3px; font: 600 10px var(--mono); background: rgba(0,0,0,.72); color: #ddd; padding: 0 4px; border-radius: 3px; pointer-events: none; }
.roll .strip .fr:hover { box-shadow: inset 0 0 0 2px var(--c); }
/* Chrome and Firefox use scrollbar-color above (the bar stays draggable); Safari, which doesn't know it, uses these */
.roll .strip::-webkit-scrollbar { height: 10px; }
.roll .strip::-webkit-scrollbar-track { background: #1b1b1b; border-radius: 5px; }
.roll .strip::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 5px; border: 2px solid #1b1b1b; }
.roll .strip::-webkit-scrollbar-thumb:hover { background: #6a6a6a; }
.roll .strip .more { flex: none; display: grid; place-items: center; padding: 0 8px; font-size: 12px; color: var(--muted); background: #111; }
.roll .meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; }
.roll .meta .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roll .meta .n { color: var(--muted); font-size: 13px; white-space: nowrap; }
.roll .meta .order { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); background: var(--c); border-radius: 4px; padding: 0 6px; }
.roll .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.empty-cam { border: 1px dashed var(--line); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--muted); font-size: 14px; }
.addcam { display: block; width: 100%; min-height: 50px; margin-top: 16px; border: 1px dashed var(--line); background: transparent; border-radius: 14px; color: var(--muted); font-size: 14px; }
.addcam:hover { color: var(--text); border-color: #555; }
.addcam.drop-target { border-color: var(--accent); color: var(--text); background: rgba(233,162,59,.06); }
.footbar {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: flex-end; align-items: center; gap: 14px;
  padding: 14px 22px; background: rgba(18,18,18,.94); border-top: 1px solid var(--line); backdrop-filter: blur(8px);
}

/* merge */
.merge { display: flex; flex-direction: column; height: calc(100vh - 55px); }
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.progress .track { width: 160px; height: 6px; background: #2a2a2a; border-radius: 3px; overflow: hidden; }
.progress .fill { height: 100%; background: var(--accent); transition: width .2s; }
.timeline { flex: none; padding: 14px 18px 12px; border-bottom: 1px solid var(--line); background: #0f0f0f; }
.timeline .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tl-row { position: relative; display: flex; gap: 0; align-items: flex-end; height: calc(14vh + 16px); min-height: 108px; overflow-x: auto; overflow-y: hidden; padding-bottom: 6px; scrollbar-color: #444 transparent; }
.tl-row > :first-child { margin-left: auto; }
.tl-item { position: relative; height: calc(100% - 30px); flex: none; cursor: grab; border-radius: 4px; overflow: hidden; border-bottom: 3px solid var(--c); opacity: .75; }
.tl-item.dragging { opacity: .25; }
.tl-item img { pointer-events: none; }
.tl-gap { flex: none; width: 10px; align-self: stretch; position: relative; cursor: pointer; }
.tl-gap::after { content: ""; position: absolute; left: 50%; top: 30px; bottom: 0; width: 2px; transform: translateX(-50%); border-radius: 1px; background: transparent; }
.tl-gap:hover::after { background: rgba(61,220,132,.55); }
.tl-gap.cursor { width: 22px; }
.tl-gap.cursor::after { width: 4px; background: var(--insert); box-shadow: 0 0 12px var(--insert); animation: blink 1s steps(1, end) infinite; }
.tl-gap.cursor::before { content: "▼"; position: absolute; top: 18px; left: 50%; transform: translateX(-50%); color: var(--insert); font-size: 11px; line-height: 1; animation: blink 1s steps(1, end) infinite; }
@keyframes blink { 50% { opacity: .15; } }
/* while dragging a photo: blinking blue bar centred in the gap it will land in, arrow at the bottom */
.tl-gap.dropping { width: 22px; }
.tl-gap.dropping::after { top: 26px; bottom: 14px; width: 4px; background: var(--drop); box-shadow: 0 0 12px var(--drop); animation: blink .8s steps(1, end) infinite; }
.tl-gap.dropping::before { content: "▲"; top: auto; bottom: 0; color: var(--drop); font-size: 11px; line-height: 1; animation: blink .8s steps(1, end) infinite; position: absolute; left: 50%; transform: translateX(-50%); }
.insertbar { text-transform: none; letter-spacing: normal; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text); background: rgba(61,220,132,.10); border: 1px solid rgba(61,220,132,.55); border-radius: 8px; padding: 4px 6px 4px 12px; }
.lane [draggable=true] { cursor: pointer; }
.lane .dragging { opacity: .35; }
.lanes.drop-target { outline: 2px dashed var(--accent); outline-offset: -6px; border-radius: 14px; }
.tl-marker { flex: none; width: 4px; align-self: stretch; margin-top: 30px; border-radius: 2px; background: var(--drop); box-shadow: 0 0 12px var(--drop); }
/* folder start: an amber post with the folder's name on a flag above the photos */
.tl-div { flex: none; align-self: stretch; position: relative; width: 4px; margin: 0 4px 0 10px; background: var(--accent); border-radius: 2px; }
.tl-div span { position: absolute; left: 0; top: 0; z-index: 1; display: block; box-sizing: border-box; max-width: 400px;
  padding: 3px 10px 4px 8px; border-radius: 0 6px 6px 0; background: var(--accent); color: var(--accent-ink);
  font-size: 13px; font-weight: 800; line-height: 15px; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.folders { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.flabel { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 12px; border-radius: 15px; background: var(--panel-2); border: 1px solid var(--line); font-size: 13px; cursor: pointer; user-select: none; }
.chip:hover { border-color: #555; }
.chip.active { background: rgba(233,162,59,.14); border-color: var(--accent); color: var(--text); }
.chip.active .cname::before { content: "● "; color: var(--accent); }
.chip .fcount { font: 11px var(--mono); color: var(--muted); }
.chip .fx { border: 0; background: transparent; padding: 0 4px; height: 22px; color: var(--muted); font-size: 13px; border-radius: 11px; }
.chip .fx:hover { color: var(--text); background: #333; }
.chip .fsort { border: 1px solid rgba(61,220,132,.45); background: transparent; color: var(--insert); height: 22px; padding: 0 8px; margin-left: 2px; border-radius: 11px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.chip .fsort:hover { background: rgba(61,220,132,.16); border-color: var(--insert); }
.tl-div.pulse span { animation: divpulse 1.4s ease-out; }
@keyframes divpulse { 0%, 40% { box-shadow: 0 0 0 3px #fff, 0 0 18px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.chip.drop-target { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(233,162,59,.35); }
button.chip { padding: 0 12px; color: var(--muted); }
button.chip:hover { color: var(--text); }
.chipform input { height: 30px; width: 180px; border-radius: 15px; padding: 0 12px; font-size: 13px; }
.chip[draggable=true] { cursor: grab; }
.chip.dragging { opacity: .35; }
.chip-marker { display: inline-block; width: 3px; height: 26px; border-radius: 2px; background: var(--drop); box-shadow: 0 0 10px var(--drop); }
.tl-div.empty { background: repeating-linear-gradient(to bottom, var(--accent) 0 5px, transparent 5px 9px); }
.tl-div.empty span { background: #0f0f0f; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); font-style: italic; font-weight: 700; }
.fhint { font-size: 12px; color: var(--muted); margin-left: 6px; }
.tl-item:hover { opacity: 1; }
.tl-item img { height: 100%; width: auto; display: block; background: #000; }

.tl-item .num { position: absolute; left: 4px; top: 4px; font: 11px var(--mono); background: rgba(0,0,0,.7); padding: 0 5px; border-radius: 3px; }
.tl-empty { height: 100%; display: grid; place-items: center; width: 100%; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; text-align: center; padding: 0 20px; }
.lanes { flex: 1; min-height: 0; display: grid; gap: 14px; padding: 14px 18px; }
.lane { min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; border-top: 4px solid var(--c); }
.lane-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 14px; }
.lane-head .name { font-weight: 600; }
.lane-head .left { color: var(--muted); }
.lane-head .spacer { flex: 1; }
.next {
  flex: 1; min-height: 0; position: relative; padding: 0; border: 0; border-radius: var(--radius); overflow: hidden;
  background: #000; display: grid; place-items: center; cursor: pointer;
}
.next img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; }
.next:hover, .next.inrun { box-shadow: inset 0 0 0 3px var(--c); }
.next .cta {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff;
  padding: 6px 12px; border-radius: 20px; font-size: 13px; display: flex; gap: 8px; align-items: center; pointer-events: none;
}
.next .zoom {
  position: absolute; right: 10px; top: 10px; width: 64px; height: 64px; padding: 0; display: grid; place-items: center; z-index: 2;
  background: rgba(0,0,0,.65); border: 1px solid rgba(255,255,255,.25); border-radius: 12px; cursor: zoom-in;
}
.next .zoom:hover { background: rgba(0,0,0,.85); border-color: rgba(255,255,255,.6); }
.next .zoom svg { width: 30px; height: 30px; }
.next .fname, .next .cta { z-index: 1; }
.badge { position: absolute; left: 8px; top: 8px; font-size: 12px; background: var(--c); color: var(--accent-ink); padding: 2px 8px; border-radius: 4px; font-weight: 600; pointer-events: none; }
.fname { position: absolute; left: 8px; bottom: 8px; font: 11px var(--mono); color: #ddd; background: rgba(0,0,0,.6); padding: 1px 6px; border-radius: 3px; pointer-events: none; }
.upnext { flex: none; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
.upnext button { position: relative; padding: 0; border: 0; height: 64px; border-radius: 6px; overflow: hidden; background: #000; }
.upnext img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; opacity: .8; }
.upnext button:hover img, .upnext button.inrun img { opacity: 1; }
.upnext button.inrun { box-shadow: inset 0 0 0 2px var(--c); }
.upnext .plus { position: absolute; right: 3px; bottom: 3px; font: 11px var(--mono); background: rgba(0,0,0,.75); padding: 0 4px; border-radius: 3px; }
.upnext .rs, .upnext .re { position: absolute; top: 0; bottom: 0; width: 4px; background: var(--c); }
.upnext .rs { left: 0; }
.upnext .re { right: 0; }
.qtag { position: absolute; left: 0; right: 0; top: 0; padding: 3px 4px; font: 700 10px/1.1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  letter-spacing: .06em; text-transform: uppercase; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.qtag.start { background: var(--c); color: #111; }
.qtag.end { background: rgba(0,0,0,.85); color: var(--c); box-shadow: inset 0 -2px 0 var(--c); }
.qtag.both { background: linear-gradient(90deg, var(--c) 50%, rgba(0,0,0,.85) 50%); color: #fff; text-shadow: 0 0 3px #000; }
/* big preview: unmissable start/end of roll */
.rollflags { position: absolute; left: 12px; top: 12px; right: 90px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; z-index: 1; pointer-events: none; }
.rollflag { display: inline-flex; flex-direction: column; padding: 9px 16px 10px; border-radius: 10px; max-width: 100%;
  font-weight: 800; font-size: 20px; line-height: 1.1; letter-spacing: .03em; text-transform: uppercase; box-shadow: 0 4px 18px rgba(0,0,0,.45); }
.rollflag small { font: 600 13px/1.3 var(--mono); letter-spacing: 0; text-transform: none; opacity: .85; margin-top: 3px; }
.rollflag.start { background: var(--c); color: #111; }
.rollflag.end { background: rgba(0,0,0,.88); color: var(--c); border: 2px solid var(--c); }
.edge { position: absolute; top: 0; bottom: 0; width: 8px; background: var(--c); z-index: 1; pointer-events: none; }
.edge.start { left: 0; }
.edge.end { right: 0; }
.lane.done { justify-content: center; align-items: center; color: var(--muted); }
.hint { flex: none; text-align: center; font-size: 13px; color: var(--muted); padding: 0 18px 12px; }

<body>
<div id="app"></div>

<script>
"use strict";
const params = new URLSearchParams(location.search);
const TOKEN = params.get("t") || "";
const LANE_COLORS = ["var(--lane-0)", "var(--lane-1)", "var(--lane-2)", "var(--lane-3)"];
const MAX_CAMERAS = 4;
const app = document.getElementById("app");

let S = null;          // the open wedding
let view = "home";
let overlay = null;    // {kind:'photo'|'roll', ...}
let quitting = false, stopped = false;  // see showStopped()
let homeError = "";
let exportJob = null;  // {id, done, total, finished, error, outdir}

// Roll Merge is two separate apps that share nothing but preview pictures: Roll Sort (one batch
// of photos into folders, S.kind "folders") and Roll Merge (film rolls from several cameras).
// Chosen on the first screen, switched by clicking the name at the top left; each keeps its own
// recent folders, progress and settings.
let APP = (() => { try { const a = localStorage.getItem("rm-app"); return a === "sort" || a === "merge" ? a : null; } catch (e) { return null; } })();
let pendingOpen = null;  // a folder given on the command line, opened once an app is chosen
function appName(a) { return (a || APP) === "sort" ? "Roll Sort" : "Roll Merge"; }
function appKind() { return APP === "sort" ? "folders" : "merge"; }
function setting(key) { try { return localStorage.getItem(`rm-${APP}-${key}`); } catch (e) { return null; } }
function setSetting(key, v) { try { localStorage.setItem(`rm-${APP}-${key}`, v); } catch (e) {} }
try { ["rm-mode", "rm-auto-refresh", "rm-grid-size"].forEach(k => localStorage.removeItem(k)); } catch (e) {}  // from before the split
const SORT_LOGO = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.6" stroke="var(--lane-0)" stroke-width="2"/><rect x="13" y="3" width="8" height="8" rx="1.6" stroke="var(--lane-1)" stroke-width="2"/><rect x="3" y="13" width="8" height="8" rx="1.6" stroke="var(--lane-1)" stroke-width="2"/><rect x="13" y="13" width="8" height="8" rx="1.6" stroke="var(--lane-0)" stroke-width="2"/></svg>`;
function logo(a) { return (a || APP) === "sort" ? SORT_LOGO : LOGO; }
const LOGO = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2.5" y="5" width="13" height="14" rx="2" stroke="var(--lane-0)" stroke-width="2"/><rect x="8.5" y="5" width="13" height="14" rx="2" stroke="var(--lane-1)" stroke-width="2"/></svg>`;
const ZOOM_ICON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>`;

// ---------------------------------------------------------------- helpers
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function img(id, size) { return `/img?t=${encodeURIComponent(TOKEN)}&g=${S.gen}&id=${id}&s=${size || "t"}`; }
function range(start, n) { return Array.from({length: n}, (_, i) => start + i); }
function fmtBytes(n) {
  if (n < 1e6) return `${Math.max(1, Math.round(n / 1e3))} KB`;
  if (n < 1e9) return `${n < 1e7 ? (n / 1e6).toFixed(1) : Math.round(n / 1e6)} MB`;
  return `${(n / 1e9).toFixed(1)} GB`;
}
function plural(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }
function shortName(name) { const stem = name.replace(/\.[^.]+$/, ""); return stem.length > 12 ? "…" + stem.slice(-6) : stem; }

async function api(path, body) {
  let res;
  try {
    res = await fetch(path, {
      method: body === undefined ? "GET" : "POST",
      headers: {"X-Token": TOKEN, "Content-Type": "application/json"},
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch (e) {
    if (!quitting) showStopped(false);
    throw new Error(`${appName()} isn't running. Start it again from its folder.`);
  }
  if (res.status === 403 && !quitting) showStopped(true);  // this tab belongs to an earlier run of Roll Merge
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function toast(msg, ms) {
  if (stopped) return;  // the stopped screen already says it all
  document.querySelectorAll(".toast").forEach(t => t.remove());  // newest message replaces the old one
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms || 2600);
}

// ---------------------------------------------------------------- model
// S.order    photo ids placed so far, in shooting order
// S.folderOf folder index for each entry of S.order (ignored while S.folders is empty)
// S.folders  [{name}]; S.active = folder that newly placed photos go into
// S.history  undo snapshots
function rollOf(id) {
  for (let r = 0; r < S.rolls.length; r++) {
    const roll = S.rolls[r];
    if (id >= roll.start && id < roll.start + roll.count) return r;
  }
  return -1;
}
function laneOfRoll(r) { return S.lanes.findIndex(l => l.rolls.includes(r)); }
function laneFrames(l) { return S.lanes[l].rolls.flatMap(r => range(S.rolls[r].start, S.rolls[r].count)); }

function derive() {
  const frames = S.lanes.map((_, l) => laneFrames(l));
  const laneOf = new Map();
  frames.forEach((f, l) => f.forEach(id => laneOf.set(id, l)));
  const out = new Set(S.order);  // placed or banished: either way not waiting on the board
  for (const id of S.banished || []) out.add(id);
  const next = frames.map(f => f.filter(id => !out.has(id)));
  const merged = S.order.map((id, k) => ({id, lane: laneOf.get(id), folder: S.folderOf[k] || 0}));
  // total = photos that are part of the sort (banished ones don't count)
  return {frames, next, merged, laneOf, total: frames.reduce((a, f) => a + f.length, 0) - (S.banished || []).length};
}

// Everything undo can bring back. Also used for the Review tab's "revert" starting point.
function stateCopy() {
  return {order: S.order.slice(), folderOf: S.folderOf.slice(), folders: S.folders.map(f => ({name: f.name})), active: S.active,
          cursor: S.cursor ? {...S.cursor} : null, banished: S.banished.slice()};
}
function sigOf(x) { return JSON.stringify([x.order, x.folderOf, x.folders.map(f => f.name), x.banished || []]); }
function stateSig() { return sigOf(S); }

function snapshot() {
  S.history.push(stateCopy());
  if (S.history.length > 80) S.history.shift();
}

// Each folder is one unbroken block on the timeline, in the order of the folder bar.
// normalize() enforces that after every change, so a folder can never appear twice.
function normalize() {
  if (!S.folders.length) return;
  const idx = S.order.map((_, k) => k).sort((a, b) => S.folderOf[a] - S.folderOf[b] || a - b);
  S.order = idx.map(k => S.order[k]);
  S.folderOf = idx.map(k => S.folderOf[k]);
}

// [start, end) positions of folder f's block (for an empty folder, start === end = where it sits).
function blockRange(f) {
  let start = 0, n = 0;
  for (const x of S.folderOf) { if (x < f) start++; else if (x === f) n++; }
  return [start, start + n];
}

// Where the next placed photo goes: the green bar.
function insertPoint() {
  const len = S.order.length;
  if (!S.folders.length) return {pos: S.cursor ? Math.min(S.cursor.pos, len) : len, folder: 0};
  const f = Math.min(S.cursor ? S.cursor.folder : S.active, S.folders.length - 1);
  const [a, b] = blockRange(f);
  return {pos: S.cursor ? Math.min(Math.max(S.cursor.pos, a), b) : b, folder: f};
}

function take(l, n) {
  const {next} = derive();
  const ids = next[l].slice(0, n);
  if (!ids.length) return;
  snapshot();
  const ip = insertPoint();
  S.order.splice(ip.pos, 0, ...ids);
  S.folderOf.splice(ip.pos, 0, ...ids.map(() => ip.folder));
  if (S.cursor) S.cursor = {pos: ip.pos + ids.length, folder: ip.folder};  // keep going from just after them
  if (ip.pos + ids.length === S.order.length) S.scrollToEnd = true; else S.scrollToCursor = true;
  S.flashIds = new Set(ids);
  save(); render();
}

function undo() {
  const snap = S.history.pop();
  if (!snap) return;
  S.order = snap.order; S.folderOf = snap.folderOf; S.folders = snap.folders; S.active = snap.active;
  S.cursor = snap.cursor || null;
  S.banished = Array.isArray(snap.banished) ? snap.banished : [];
  S.keepScroll = true;
  save(); render();
}

function rewindTo(k) {
  snapshot();
  S.order = S.order.slice(0, k + 1);
  S.folderOf = S.folderOf.slice(0, k + 1);
  S.cursor = null;
  S.scrollToEnd = true;
  save();
}

function movePhoto(from, to, target) {
  // `to` is the position in the list once the photo has been taken out;
  // `target` is the folder of the drop spot (each gap belongs to one folder)
  if (to === from && (target === undefined || target === S.folderOf[from])) return;
  snapshot();
  S.keepScroll = true;
  const [id] = S.order.splice(from, 1);
  const [own] = S.folderOf.splice(from, 1);
  let folder = own;
  if (S.folders.length) {
    if (target !== undefined) folder = target;
    else {
      const left = to > 0 ? S.folderOf[to - 1] : undefined;
      const right = to < S.folderOf.length ? S.folderOf[to] : undefined;
      if (own !== left && own !== right) folder = left !== undefined ? left : right !== undefined ? right : own;
    }
  }
  S.order.splice(to, 0, id);
  S.folderOf.splice(to, 0, folder);
  S.flashIds = new Set([id]);
  if (S.cursor) {  // keep the insert spot next to the same photos
    let pos = S.cursor.pos;
    if (from < pos) pos--;
    if (to < pos) pos++;
    S.cursor.pos = pos;
  }
  warnFrameOrder(id);
  save(); render();
}

// The frames of one camera should stay in frame order: warn if a manual move breaks it.
function warnFrameOrder(id) {
  if (S.kind === "folders") return;
  const {merged, laneOf, next} = derive();
  const lane = laneOf.get(id);
  const frameIdx = new Map(laneFrames(lane).map((x, i) => [x, i]));
  let last = -1, ok = true;
  for (const m of merged) if (m.lane === lane) { const i = frameIdx.get(m.id); if (i < last) { ok = false; break; } last = i; }
  const skipped = next[lane].some(x => frameIdx.get(x) < frameIdx.get(id));
  if (!ok) toast(`Heads up: that puts a ${S.lanes[lane].name} photo before an earlier frame from the same camera. Z undoes.`);
  else if (skipped) toast(`Placed out of turn: earlier ${S.lanes[lane].name} frames are still waiting on the board.`);
}

// Drag from the board straight into the strip: place just this one photo at position `to`.
function placeAt(id, to, folder) {
  if (S.order.includes(id)) return;
  snapshot();
  if (folder === undefined) folder = S.cursor ? S.cursor.folder : S.active;
  if (S.folders.length && folder === undefined) {
    if (to > 0) folder = S.folderOf[to - 1];
    else if (S.folderOf.length) folder = S.folderOf[0];
  }
  S.order.splice(to, 0, id);
  S.folderOf.splice(to, 0, S.folders.length ? folder : 0);
  if (S.cursor && to < S.cursor.pos) S.cursor.pos++;
  S.keepScroll = true;
  S.flashIds = new Set([id]);
  S.sel.delete(id);
  warnFrameOrder(id);
  save(); render();
}

// Sort-into-folders mode: put these photos at the end of folder f (default: where the green bar is).
function placeIds(ids, f) {
  ids = ids.filter(id => !S.order.includes(id) && !S.banished.includes(id)).sort((a, b) => a - b);
  if (!ids.length) return;
  if (!S.folders.length) { toast("Add a folder first: click “+ Folder” above."); return; }
  snapshot();
  const here = insertPoint();
  const ip = f === undefined || f === here.folder ? here : {pos: blockRange(f)[1], folder: f};
  S.order.splice(ip.pos, 0, ...ids);
  S.folderOf.splice(ip.pos, 0, ...ids.map(() => ip.folder));
  if (S.cursor && (ip.pos < S.cursor.pos || (ip.pos === S.cursor.pos && ip.folder === S.cursor.folder))) S.cursor.pos += ids.length;
  if (ip !== here) S.keepScroll = true;  // sent to another folder with a number key: leave the strip where it is
  else if (ip.pos + ids.length === S.order.length) S.scrollToEnd = true;
  else S.scrollToCursor = true;
  S.flashIds = new Set(ids);
  ids.forEach(id => S.sel.delete(id));
  if (!S.sel.size) S.selAnchor = null;
  if (ids.length > 1 || ip !== here) toast(`${plural(ids.length, "photo")} → ${S.folders[ip.folder].name}`, 1600);
  save(); render();
}

// Sort mode: the board keeps its layout while you click. A sorted photo leaves a blank placeholder
// until the board is refreshed (R, the button, or by itself after N gaps once you pause).
function boardSlots() {
  const unsorted = derive().next[0];
  if (!S.gridSlots) S.gridSlots = unsorted.slice();
  else {
    const have = new Set(S.gridSlots);
    for (const id of unsorted) if (!have.has(id)) {  // e.g. sent back from the timeline: slot it in by name order
      const at = S.gridSlots.findIndex(x => x > id);
      if (at < 0) S.gridSlots.push(id); else S.gridSlots.splice(at, 0, id);
    }
  }
  const open = new Set(unsorted);
  const visible = S.gridSlots.filter(id => open.has(id));
  return {slots: S.gridSlots, open, visible, gaps: S.gridSlots.length - visible.length};
}

function refreshBoard(auto) {
  clearTimeout(autoTimer); autoTimer = null;
  S.gridSlots = derive().next[0].slice();
  S.keepScroll = true;
  render();
  if (auto) toast("Board refreshed: the gaps are closed up.", 1500);
}

function autoN() {
  try { const v = setting("auto-refresh"); return v === null ? 12 : +v || 0; } catch (e) { return 12; }
}

let autoTimer = null;
function armAutoRefresh() {
  clearTimeout(autoTimer); autoTimer = null;
  if (!S || S.kind !== "folders" || view !== "merge" || !autoN()) return;
  if (boardSlots().gaps < autoN()) return;
  autoTimer = setTimeout(() => {
    autoTimer = null;
    if (!S || view !== "merge" || overlay || S.sel.size || S.mode) return;  // never while selecting or in a mode
    if (S.addingFolder || S.renaming !== undefined || typing()) return armAutoRefresh();  // wait until they've finished typing
    if (boardSlots().gaps >= autoN()) refreshBoard(true);
  }, 1500);
}

function typing() {
  const a = document.activeElement;
  return !!a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && !["range", "checkbox", "radio"].includes(a.type)));
}

function gridClick(id, e) {
  if (S.mode === "banish") return banishBoard(id);
  if (S.mode) return toast(modeBlocked(), 3500);
  const list = boardSlots().visible;
  if (!S.sel.size) S.selAnchor = null;  // nothing selected: the next Shift-click is a new start point
  // Shift-click: the first one marks the start, the next one selects everything from there to here
  if (e.shiftKey) {
    if (S.selAnchor !== null && list.includes(S.selAnchor)) {
      const a = list.indexOf(S.selAnchor), b = list.indexOf(id);
      S.sel = new Set(list.slice(Math.min(a, b), Math.max(a, b) + 1));
    } else { S.sel = new Set([id]); S.selAnchor = id; }
    return refreshGridSelection();
  }
  // while a selection exists, plain clicks add or remove single photos
  if (S.sel.size) {
    if (S.sel.has(id)) S.sel.delete(id); else S.sel.add(id);
    if (!S.sel.size) S.selAnchor = null;
    return refreshGridSelection();
  }
  placeIds([id]);
}

function gridSize() {
  if (!S.gridSize) { try { S.gridSize = +setting("grid-size") || 190; } catch (e) { S.gridSize = 190; } }
  return S.gridSize;
}

function gbarHtml() {
  const {visible, gaps} = boardSlots();
  const left = visible.length;
  const f = S.folders.length ? S.folders[insertPoint().folder].name : null;
  const n = S.sel.size;
  return `<div class="gbar">
    <span><b>${left}</b> to sort</span>
    ${!f ? `<span class="warnline">First add a folder for each group, with “+ Folder” above.</span>`
      : n === 1 && S.selAnchor !== null ? `<span>Start point chosen. Now <kbd>Shift</kbd>-click the last photo to select everything in between.</span>`
      : n ? `<span>Click photos to add or remove them from the selection.</span>`
      : `<span>Click a photo to put it in <b class="fdest">${esc(f)}</b></span>`}
    <span class="spacer"></span>
    ${n ? `<span class="selcount">✓ ${n} selected</span>
           <button class="primary small" data-act="gsend" ${f ? "" : "disabled"}>Put ${n === 1 ? "it" : `all ${n}`} in ${esc(f || "")} <kbd>Enter</kbd></button>
           <button class="small" data-act="gclear">Clear selection <kbd>Esc</kbd></button>`
        : `<button class="small" data-act="gselall" title="Select every photo still to sort (Ctrl/⌘+A)">Select all</button>`}
    ${gaps ? `<button class="small" data-act="grefresh" title="Close up the gaps left by sorted photos">⟳ Refresh board · ${plural(gaps, "gap")} <kbd>R</kbd></button>` : ""}
    <label class="gauto" title="Close up the gaps by itself once there are this many, as soon as you pause">Auto-refresh
      <select data-act="gauto">${[0, 8, 12, 24].map(v => `<option value="${v}" ${v === autoN() ? "selected" : ""}>${v ? `after ${v} gaps` : "off"}</option>`).join("")}</select></label>
    <label class="gsize" title="Photo size">Size <input type="range" min="110" max="360" step="10" value="${gridSize()}" data-act="gsize"></label>
  </div>`;
}

function clearSelection() { S.sel.clear(); S.selAnchor = null; refreshGridSelection(); }

function refreshGridSelection() {
  document.querySelectorAll(".gtile").forEach(t => t.classList.toggle("sel", S.sel.has(+t.dataset.id)));
  const bar = document.querySelector(".gbar");
  if (bar) bar.outerHTML = gbarHtml();
}

function enlargeFromGrid(id) {
  const list = boardSlots().visible;
  const i = list.indexOf(id);
  if (i >= 0) openPhotos(list, i, {title: k => `${k + 1} of ${list.length} still to sort`});
}

function assignFolder(k, f) {
  if (S.folderOf[k] === f) return;
  snapshot();
  S.folderOf[k] = f;
  toast(`Moved photo #${k + 1} into “${S.folders[f].name}”.`);
  save(); render();
}

function addFolders(names) {
  S.addingFolder = false;
  names = names.map(n => n.trim()).filter(Boolean);
  if (!names.length) return render();
  snapshot();
  if (!S.folders.length) {  // first folders: everything placed so far goes into the first one
    for (const name of names) S.folders.push({name});
    S.active = 0; S.cursor = null; S.folderOf = S.order.map(() => 0);
    return save(), render();
  }
  // A new folder goes where the green bar is: before the folder whose start it marks,
  // otherwise straight after the folder it's in (folders are never split in two).
  const ip = insertPoint();
  const [a, b] = blockRange(ip.folder);
  let at = S.folders.length;
  if (S.cursor || ip.pos !== S.order.length) at = (ip.pos === a && b > a) ? ip.folder : ip.folder + 1;
  S.folders.splice(at, 0, ...names.map(name => ({name})));
  const bump = f => f >= at ? f + names.length : f;
  S.folderOf = S.folderOf.map(bump);
  S.active = at;          // start filling the new folder straight away
  S.cursor = null;        // the green bar now sits where the new folder starts
  save(); render();
}

// Drag a folder chip to a new spot: its photos move with it on the timeline.
function moveFolder(from, to) {
  const perm = S.folders.map((_, i) => i);  // perm[newIndex] = oldIndex
  perm.splice(from, 1); perm.splice(to, 0, from);
  if (perm.every((o, i) => o === i)) return;
  snapshot();
  const newOf = []; perm.forEach((old, i) => { newOf[old] = i; });
  let offset = null;
  if (S.cursor) offset = S.cursor.pos - blockRange(S.cursor.folder)[0];
  S.folders = perm.map(o => S.folders[o]);
  S.folderOf = S.folderOf.map(f => newOf[f]);
  S.active = newOf[S.active];
  if (S.cursor) S.cursor.folder = newOf[S.cursor.folder];
  normalize();
  if (S.cursor) S.cursor.pos = blockRange(S.cursor.folder)[0] + offset;
  S.keepScroll = true;
  save(); render();
}

function renameFolder(i, name) {
  name = name.trim();
  if (name && name !== S.folders[i].name) { snapshot(); S.folders[i].name = name; save(); }
  S.renaming = undefined; render();
}

// Take photos (by position) off the timeline: they go back to their camera on the board.
function unplace(positions) {
  const drop = new Set(positions);
  if (!drop.size) return;
  if (S.cursor) S.cursor.pos -= positions.filter(k => k < S.cursor.pos).length;
  S.order = S.order.filter((_, k) => !drop.has(k));
  S.folderOf = S.folderOf.filter((_, k) => !drop.has(k));
}

function sendToBoard(k) {
  snapshot(); unplace([k]);
  toast("Sent back to the board. It's waiting in its camera's lane again.");
  S.keepScroll = true;
  save(); render();
}

// ---- banish: take a photo out of the sort completely (bad frames, exact duplicates). Never deletes anything.
function banishPlaced(k) {
  snapshot();
  const id = S.order[k];
  unplace([k]);
  S.banished.push(id);
  toast(`Banished #${k + 1}. Z undoes it, or recover it any time from “Banished”.`, 3500);
  S.keepScroll = true;
  save(); render();
}

function banishBoard(id) {
  if (S.banished.includes(id) || S.order.includes(id)) return;
  snapshot();
  S.banished.push(id);
  toast("Banished. Z undoes it, or recover it any time from “Banished”.", 3500);
  save(); render();
}

function recover(id) {
  if (!S.banished.includes(id)) return;
  snapshot();
  S.banished = S.banished.filter(x => x !== id);
  toast("Recovered. It's back on the board, in its camera's lane.", 3500);
  save(); render();
}

function recoverAll() {
  if (!S.banished.length) return;
  snapshot();
  const n = S.banished.length;
  S.banished = []; overlay = null;
  toast(`Recovered ${plural(n, "photo")}. They're back on the board.`, 3500);
  save(); render();
}

// ---- Sort tab modes
function setMode(m) {
  S.mode = m || null;
  if (m === "remove") toast("Remove mode is on: any photo you click in the strip goes back down to the board. Untick the box (or press Esc) to go back to normal.", 6500);
  if (m === "banish") toast("Banish mode is on: any photo you click, in the strip or on the board, is banished from sorting. Untick the box (or press Esc) to go back to normal.", 6500);
  render();
}
function modeBlocked() {
  return `${S.mode === "remove" ? "Remove" : "Banish"} mode is on. Untick it (or press Esc) to place photos again.`;
}

// ---- Review tab: put everything back the way it was on arrival from the Sort tab
function revertReview() {
  const b = S.reviewBase;
  if (!b || sigOf(b) === stateSig()) return;
  overlay = {kind: "choice", title: "Revert all changes made on this screen?",
             text: "Every photo move, folder rename and recovery made here since you came from the Sort tab is undone. You can still press Undo afterwards if you change your mind.",
             options: [{value: "yes", label: "Revert all review changes", sub: "Back to how it was when you arrived from the Sort tab."}],
             onPick: () => {
               snapshot();
               S.order = b.order.slice(); S.folderOf = b.folderOf.slice(); S.folders = b.folders.map(f => ({name: f.name}));
               S.active = b.active; S.cursor = b.cursor ? {...b.cursor} : null; S.banished = (b.banished || []).slice();
               toast("Reverted: back to how it was when you came from the Sort tab.", 3500);
               save(); render();
             }};
  renderOverlay();
}

function setCursor(pos, folder) {
  if (S.folders.length) {
    S.active = folder;
    // the end of a folder is its normal spot, so no special marker is needed there
    S.cursor = pos === blockRange(folder)[1] ? null : {pos, folder};
  } else {
    S.cursor = pos >= S.order.length ? null : {pos, folder: 0};
  }
  S.scrollToCursor = true;
  render(); save();
}

function deleteFolder(i) {
  const name = S.folders[i].name;
  const positions = S.folderOf.map((f, k) => f === i ? k : -1).filter(k => k >= 0);
  if (!positions.length) return applyDelete(i, "empty");
  const opts = [];
  if (i > 0) opts.push({value: "prev", label: `Move them into “${S.folders[i - 1].name}”`, sub: "The folder before it."});
  if (i < S.folders.length - 1) opts.push({value: "next", label: `Move them into “${S.folders[i + 1].name}”`, sub: "The folder after it."});
  const sortLast = S.kind === "folders" && S.folders.length === 1;  // Roll Sort: every sorted photo needs a folder
  if (sortLast) opts.push({value: "rename", label: `Keep the folder and rename it instead`, sub: "Its photos stay where they are."});
  opts.push({value: "board", label: "Send them back to the board", sub: S.kind === "folders"
    ? "They go back to the photos still to sort, and the folder is deleted."
    : "They go back into their camera lanes, ready to be placed again wherever you choose."});
  if (!sortLast && S.folders.length === 1) opts.push({value: "flat", label: "Keep them where they are", sub: "Just stop using folders."});
  overlay = {kind: "choice", title: `Delete “${name}”?`,
             text: sortLast ? `It's the only folder, and it holds ${plural(positions.length, "photo")}. Sorted photos always need a folder to go in. What would you like to do?`
                            : `It holds ${plural(positions.length, "photo")}. What should happen to them?`,
             options: opts, onPick: v => v === "rename" ? (S.renaming = i, S.addingFolder = false, render()) : applyDelete(i, v)};
  renderOverlay();
}

function applyDelete(i, mode) {
  snapshot();
  const shift = f => f > i ? f - 1 : f;
  if (mode === "prev" || mode === "next") {
    const target = mode === "prev" ? i - 1 : i + 1;
    S.folderOf = S.folderOf.map(f => shift(f === i ? target : f));
  } else if (mode === "board") {
    unplace(S.folderOf.map((f, k) => f === i ? k : -1).filter(k => k >= 0));
    S.folderOf = S.folderOf.map(shift);
  } else {
    S.folderOf = S.folderOf.map(shift);
  }
  const fallback = mode === "next" ? i : Math.max(0, i - 1);
  const fix = f => f === i ? fallback : shift(f);
  S.active = fix(S.active);
  if (S.cursor) S.cursor.folder = fix(S.cursor.folder);
  S.folders.splice(i, 1);
  if (!S.folders.length || mode === "flat") {
    S.folders = []; S.folderOf = S.order.map(() => 0); S.active = 0;
    if (S.cursor) S.cursor.folder = 0;
  }
  if (mode === "board") toast("Those photos are back on the board. Pick a spot in the strip, then place them.");
  save(); render();
}

// Export folders are numbered by where they start in the timeline, not by when they were created.
// Folders sit on the timeline in folder-bar order; export numbers skip empty ones.
function cleanName(name) {
  return name.replace(/[\\/:*?"<>|\x00-\x1f]/g, "").replace(/^[ .\t]+|[ .\t]+$/g, "").slice(0, 80).replace(/[ .\t]+$/, "");
}

function folderDirName(i) {
  if (S.kind === "folders") {
    // plain names ("Bracelets"); a repeated name gets " 2", " 3"... so folders never merge on export
    const used = new Map();
    for (let f = 0; f <= i; f++) {
      if (f !== i && !S.folderOf.includes(f)) continue;
      const base = cleanName(S.folders[f].name) || "Folder";
      const n = (used.get(base.toLowerCase()) || 0) + 1;
      used.set(base.toLowerCase(), n);
      if (f === i) return n > 1 ? `${base} ${n}` : base;
    }
  }
  let rank = 0;
  for (let f = 0; f < i; f++) if (S.folderOf.includes(f)) rank++;
  // same clean-up as the export does (rollmerge.py safe_name_part), so the Review tab shows the real folder name
  const name = S.folders[i].name.replace(/[\\/:*?"<>|\x00-\x1f]/g, "").replace(/^[ .\t]+|[ .\t]+$/g, "");
  return `${String(rank + 1).padStart(2, "0")} ${name}`.slice(0, 80).replace(/[ .\t]+$/, "");
}

let saveTimer = null;
function flushSave() { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; return writeState(); } }
function save() {
  normalize();
  // A change made anywhere but the Review tab moves the Review tab's "revert" starting point
  const sig = stateSig();
  if (sig !== S.lastSig) { if (view !== "review") S.reviewBase = null; S.lastSig = sig; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeState, 250);
}
function writeState(keepalive) {
  saveTimer = null;
  {
    const state = {
      version: 2,
      lanes: S.lanes.map(l => ({name: l.name, rolls: l.rolls.map(r => ({key: S.rolls[r].key, count: S.rolls[r].count}))})),
      order: S.order, folderOf: S.folderOf, folders: S.folders, active: S.active, cursor: S.cursor || null,
      banished: S.banished, reviewBase: S.reviewBase || null,
      history: S.history.slice(-30),
      outdir: S.outdir, date: S.date, prefix: S.prefix, nameMode: S.nameMode, kind: S.kind, fNameMode: S.fNameMode,
    };
    if (keepalive) {
      return fetch("/api/state", {method: "POST", keepalive: true, headers: {"X-Token": TOKEN, "Content-Type": "application/json"},
                                  body: JSON.stringify({root: S.root, app: APP, state})}).catch(() => {});
    }
    return api("/api/state", {root: S.root, app: APP, state}).catch(e => toast("Couldn't save progress: " + e.message));
  }
}
window.addEventListener("pagehide", () => { if (S && saveTimer) { clearTimeout(saveTimer); writeState(true); } });

function defaultLanes() {
  return [{name: "Camera 1", rolls: S.rolls.map((_, i) => i)}, {name: "Camera 2", rolls: []}];
}

function validOrder(order) {
  if (!Array.isArray(order)) return false;
  const {laneOf} = derive();
  const seen = new Set();
  for (const id of order) {
    if (!Number.isInteger(id) || !laneOf.has(id) || seen.has(id)) return false;
    seen.add(id);
  }
  return true;
}

function cleanBanished(list, inOrder) {
  const {laneOf} = derive();
  const seen = new Set();
  return (Array.isArray(list) ? list : []).filter(id => Number.isInteger(id) && laneOf.has(id) && !inOrder.has(id) && !seen.has(id) && seen.add(id));
}

// A saved undo step (or revert point) is only used if it still fits this folder.
function cleanSnap(h) {
  if (!h || !validOrder(h.order) || !Array.isArray(h.folderOf) || h.folderOf.length !== h.order.length || !Array.isArray(h.folders)) return null;
  const folders = h.folders.map(f => ({name: String((f && f.name) || "Folder")}));
  return {order: h.order, folderOf: h.folderOf.map(f => Number.isInteger(f) && f >= 0 && f < Math.max(1, folders.length) ? f : 0),
          folders, active: Math.min(Math.max(0, h.active | 0), Math.max(0, folders.length - 1)), cursor: h.cursor || null,
          banished: cleanBanished(h.banished, new Set(h.order))};
}

function restore(saved) {
  // Rebuild the saved setup, but only trust saved progress if the rolls are unchanged.
  const byKey = new Map(S.rolls.map((r, i) => [r.key, i]));
  let intact = true;
  const used = new Set();
  const lanes = (saved.lanes || []).map(l => ({
    name: l.name || "Camera",
    rolls: (l.rolls || []).map(x => {
      const i = byKey.get(x.key);
      if (i === undefined || S.rolls[i].count !== x.count || used.has(i)) { intact = false; return null; }
      used.add(i); return i;
    }).filter(i => i !== null),
  })).slice(0, MAX_CAMERAS);
  if (!lanes.length) return false;
  const missing = S.rolls.map((_, i) => i).filter(i => !used.has(i));
  if (missing.length) { intact = false; lanes[0].rolls.push(...missing); }
  S.lanes = lanes;
  S.outdir = saved.outdir || S.outdir;
  S.date = saved.date || S.date;
  S.prefix = saved.prefix || "";
  S.nameMode = saved.nameMode || "keep";
  S.kind = saved.kind === "folders" ? "folders" : "merge";
  S.fNameMode = saved.fNameMode === "folder" ? "folder" : "keep";
  S.folders = Array.isArray(saved.folders) ? saved.folders.filter(f => f && f.name).map(f => ({name: String(f.name)})) : [];
  S.active = Math.min(Math.max(0, saved.active | 0), Math.max(0, S.folders.length - 1));
  const hadProgress = (saved.order || saved.seq || []).length > 0;
  if (!intact) {
    if (hadProgress) toast("The rolls in this folder changed since last time, so merging starts over.");
    return true;
  }
  let order = saved.order;
  if (!order && Array.isArray(saved.seq)) {  // progress saved by version 1
    const frames = lanes.map((_, l) => laneFrames(l)); const pos = lanes.map(() => 0);
    order = [];
    for (const l of saved.seq) { if (frames[l] && pos[l] < frames[l].length) order.push(frames[l][pos[l]++]); }
  }
  if (validOrder(order || [])) {
    S.order = order || [];
    const fo = Array.isArray(saved.folderOf) && saved.folderOf.length === S.order.length ? saved.folderOf : S.order.map(() => 0);
    S.folderOf = fo.map(f => (Number.isInteger(f) && f >= 0 && f < S.folders.length) ? f : 0);
    normalize();  // repairs progress saved before folders were kept in one piece
    const c = saved.cursor;
    S.cursor = c && Number.isInteger(c.pos) && c.pos >= 0 && c.pos <= S.order.length ? {pos: c.pos, folder: Math.min(c.folder | 0, Math.max(0, S.folders.length - 1))} : null;
    S.banished = cleanBanished(saved.banished, new Set(S.order));
    S.history = (saved.history || []).map(cleanSnap).filter(Boolean);
    S.reviewBase = cleanSnap(saved.reviewBase);
  }
  return true;
}

// ---------------------------------------------------------------- actions
async function chooseFolder() {
  homeError = "";
  try {
    const r = await api("/api/pick-folder", {prompt: "Choose the folder the lab sent"});
    if (r.unavailable) { homeError = "The folder picker isn't available here. Paste the folder's location below instead."; render(); return; }
    if (r.path) await openFolder(r.path);
  } catch (e) { homeError = e.message; render(); }
}

async function openFolder(path) {
  homeError = "";
  if (!path || !path.trim()) { homeError = "Paste a folder location first."; render(); return; }
  try {
    if (S) await flushSave();
    const d = await api("/api/open", {path, app: APP});
    if (!d.rolls.length) { homeError = `No JPG or TIFF photos were found in “${d.rootName}”.`; render(); return; }
    S = {
      root: d.root, rootName: d.rootName, gen: d.gen, rolls: d.rolls, names: d.names,
      lanes: null, order: [], folderOf: [], folders: [], active: 0, history: [], cursor: null,
      banished: [], reviewBase: null, mode: null,
      outdir: d.defaultOutdir, date: d.today, prefix: "", nameMode: "keep",
      kind: appKind(), fNameMode: "keep", sel: new Set(), selAnchor: null, hoverId: null, clearPreviews: true,
    };
    exportJob = null;
    const restored = d.saved && restore(d.saved);
    if (!restored) S.lanes = defaultLanes();
    S.setupSig = setupSig();
    S.lastSig = stateSig();
    S.kind = appKind();  // the server only hands back this app's own progress
    if (!restored && S.kind === "folders") { setKind("folders"); return; }
    const {merged, total} = derive();
    if (S.kind === "folders") view = merged.length === total && total > 0 ? "review" : "merge";
    else view = merged.length === total && total > 0 ? "review" : merged.length ? "merge" : "setup";
    S.lastView = view;
    save(); render();
  } catch (e) { homeError = e.message; render(); }
}

// The first screen, and the name at the top left: choose Roll Sort or Roll Merge.
let chooseFrom = null;  // the view to go back to if the same app is picked again
function showChooser() {
  if (S) flushSave();
  chooseFrom = S && view !== "choose" ? view : null;
  overlay = null; view = "choose"; window.scrollTo(0, 0); render();
}
async function pickApp(a) {
  if (a === APP && S && chooseFrom) { const v = chooseFrom; chooseFrom = null; return goTo(v); }
  if (S) await flushSave();
  S = null; exportJob = null; homeError = ""; chooseFrom = null;
  APP = a;
  try { localStorage.setItem("rm-app", a); } catch (e) {}
  document.title = appName();
  view = "home";
  if (pendingOpen) { const p = pendingOpen; pendingOpen = null; return openFolder(p); }
  window.scrollTo(0, 0); render();
}

function renderChooser() {
  const card = (a, what, eg) => `<button class="appcard" data-act="pickapp" data-app="${a}">

      <span class="go">${a === APP && S ? `Back to ${esc(S.rootName)} →` : `Use ${appName(a)} →`}</span></button>`;

function setKind(kind) {
  S.kind = kind; S.undecided = false; S.gridSlots = null;
  S.lanes = kind === "folders" ? [{name: "Photos", rolls: S.rolls.map((_, i) => i)}] : defaultLanes();
  S.setupSig = setupSig();
  S.mode = null; S.sel = new Set(); S.selAnchor = null;
  S.lastView = kind === "folders" ? "merge" : "setup";
  view = S.lastView;
  save(); render();
}

function closeOverlay() {
  const o = overlay;
  overlay = o && o.back ? o.back : null;
  renderOverlay();
  if (o && !overlay && o.onCancel) o.onCancel();
}

function setupSig() { return JSON.stringify(S.lanes.map(l => l.rolls)); }

function changeSetup(fn) {
  if (S.order.length && !confirm(`You've already placed ${plural(S.order.length, "photo")}. Changing the rolls will restart the merge. Continue?`)) return;
  fn();
  S.order = []; S.folderOf = []; S.history = []; S.cursor = null; S.reviewBase = null;  // folders and banished photos are kept
  save(); render();
}

function goTo(v) {
  if (v !== "home" && !S) return;
  if (v === "setup" && S.kind === "folders") v = "merge";
  if (v === "merge") {  // cameras without rolls have nothing to sort
    const keep = S.lanes.map((l, i) => l.rolls.length ? i : -1).filter(i => i >= 0);
    if (!keep.length) return;
    if (keep.length !== S.lanes.length) { S.lanes = keep.map(i => S.lanes[i]); save(); }
  }
  if (S) { flushSave(); if (v !== "home") S.lastView = v; }
  overlay = null; S && (S.addingFolder = false, S.renaming = undefined, S.mode = null);
  view = v; window.scrollTo(0, 0); render();
}

async function doExport() {
  const {merged, total} = derive();
  const partial = merged.length !== total;
  if (!merged.length || (partial && !S.partialExport)) return;
  const order = merged.map(m => ({id: m.id, lane: S.lanes[m.lane].name, roll: S.rolls[rollOf(m.id)].name,
                                  folder: S.folders.length ? folderDirName(m.folder) : ""}));
  try {
    const r = await api("/api/export", {gen: S.gen, order, outdir: S.outdir, date: S.date, prefix: S.nameMode === "custom" ? S.prefix : "", partial, banished: S.banished, clearPreviews: !!S.clearPreviews, kind: S.kind, naming: S.fNameMode});
    exportJob = {id: r.job, done: 0, total: order.length, finished: false, leftOut: total - order.length};
    render(); pollJob();
  } catch (e) { exportJob = {error: e.message, finished: true}; render(); }
}

async function pollJob() {
  if (!exportJob || exportJob.finished) return;
  try { Object.assign(exportJob, await api(`/api/job?id=${exportJob.id}`)); }
  catch (e) { exportJob.error = e.message; exportJob.finished = true; }
  renderExportStatus();
  if (!exportJob.finished) setTimeout(pollJob, 300);
}

// The background program has gone away (window closed, computer slept, etc.). Nothing can be
// saved and no previews can load, so stop here clearly instead of letting work pile up unsaved.
function showStopped(oldTab) {
  if (stopped) return;
  stopped = true; overlay = null; clearTimeout(saveTimer); saveTimer = null;
  document.querySelectorAll(".toast").forEach(t => t.remove());
  app.innerHTML = `<div class="stopped"><div>${logo().replace("<svg", '<svg width="40" height="40"')}

    <p>${oldTab ? `${appName()} has been started again since this tab was opened, so it can't save from here.`
                : "It may have been closed, or the computer went to sleep. Your progress up to the last change was saved."}</p>
    <p>${oldTab ? "Close this tab and use the newer tab instead. If you can't find it, double-click <b>Start Roll Sort</b> again."
                : "Close this tab, then double-click <b>Start Roll Sort</b> again."} You'll carry on from where you were.</p></div></div>`;
  renderOverlay();
}

async function quitApp() {
  if (S) await flushSave();

  try { await api("/api/quit", {}); } catch (e) {}
  app.innerHTML = `<div class="stopped"><div>${logo().replace("<svg", '<svg width="40" height="40"')}<p>${appName()} has stopped. You can close this tab.</p></div></div>`;

// Forget everything saved, as if Roll Merge had never been opened. Photos and exports are never touched.
function resetEverything() {
  const name = appName(), other = appName(APP === "sort" ? "merge" : "sort");
  overlay = {kind: "choice", title: `Reset ${name}?`,
    text: `This is for starting over from scratch, e.g. if something has got into a muddle. It deletes what ${name} has saved on this computer:`,
    list: [
      `<b>Progress for every folder</b> you've worked on in ${name}: the “Pick up where you left off” list, ${APP === "sort" ? "sorted photos" : "cameras and rolls, sort order"}, folders, banished photos and undo history.${S ? " The folder that's open now is closed." : ""}`,
      `<b>Your ${name} settings</b>${APP === "sort" ? ": board size and auto-refresh" : ""}.`,
      "<b>All preview pictures</b> (they're simply made again when needed).",
      `Your <b>photos and exported copies are not touched</b>. This can't be undone.`,
    ],
    options: [
      {value: APP, label: `Reset ${name}`, sub: `${other} and its progress are kept.`, danger: true},
      {value: "all", label: `Reset both ${name} and ${other}`, sub: "Everything, as if it's the very first time. You'll be asked which one to use again.", danger: true},
    ],
    onPick: async which => {
      clearTimeout(saveTimer); saveTimer = null;  // nothing of the open folder may be saved again
      let r;
      try { r = await api("/api/reset", {app: which}); } catch (e) { return toast(e.message); }
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
        keys.filter(k => which === "all" ? k.startsWith("rm-") : k.startsWith(`rm-${which}-`)).forEach(k => localStorage.removeItem(k));
      } catch (e) {}
      const done = which === "all" ? "Roll Sort and Roll Merge have" : `${name} has`;
      S = null; exportJob = null; homeError = ""; view = "home";
      if (which === "all") { APP = null; view = "choose"; }
      await render();
      toast(`${done} been reset${r.forgotten ? `: ${plural(r.forgotten, "folder")} forgotten` : ""}. It's back to how it was the first time.`, 4500);
    }};
  renderOverlay();
}

// Mouse wheel over a sideways strip scrolls the strip (down = later photos), never the page.
function wheelScrollsSideways(el) {
  el.addEventListener("wheel", e => {
    if (e.ctrlKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;  // pinch-zoom, or a trackpad's own sideways swipe
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? el.clientWidth : 1;  // lines / pages / pixels
    el.scrollLeft += e.deltaY * unit;
  }, {passive: false});
}

function laneKeyHint(l) {
  if (S.lanes.length === 2) return l === 0 ? `<kbd>←</kbd> or <kbd>1</kbd>` : `<kbd>→</kbd> or <kbd>2</kbd>`;
  return `<kbd>${l + 1}</kbd>`;
}

function folderBar(merged) {
  const addCtl = S.addingFolder

    return `<div class="folders"><span class="flabel">Folders</span>
      ${S.kind === "folders" ? "" : `<button class="chip" data-act="preset">+ Pre-Ceremony · The-Ceremony · Reception</button>`}${addCtl}
      <span class="fhint">${S.kind === "folders" ? "Add a folder for each group, e.g. Bracelets, Necklaces, Earrings." : "Optional: split the photos into folders as you go."}</span></div>`;
  }
  const counts = S.folders.map(() => 0);
  merged.forEach(m => { counts[m.folder]++; });
  const chips = S.folders.map((f, i) => S.renaming === i
    ? `<form class="chipform" data-act="renameform" data-folder="${i}"><input type="text" id="renameFolder" value="${esc(f.name)}" autocomplete="off"></form>`
